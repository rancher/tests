---
name: "Revoke Runner IP"
description: "Remove runner IP from AWS prefix list"
inputs:
  prefix-list-id:
    description: "AWS prefix list ID"
    required: true
  region:
    description: "AWS region"
    required: true
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        RUNNER_IPV4=$(curl -4 -s https://checkip.amazonaws.com)
        REGION="${{ inputs.region }}"
        PREFIX_LIST_ID="${{ inputs.prefix-list-id }}"

        echo "::add-mask::$RUNNER_IPV4"
        echo "::add-mask::$PREFIX_LIST_ID"

        remove_ip_from_prefix_list() {
          local prefix_list_id=$1
          local cidr=$2
          local base_desc="TFP_GitHubRunner"

          get_refcount() {
            local description=$1

            if [[ "$description" =~ ^TFP_GitHubRunner:([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[1]}"
              return
            fi

            if [[ "$description" == "TFP_GitHubRunner" || -z "$description" ]]; then
              echo "1"
              return
            fi

            echo "1"
          }

          wait_for_entry_removal() {
            local max_wait_attempts=$1
            local wait_attempt=1

            while (( wait_attempt <= max_wait_attempts )); do
              local observed_json
              observed_json=$(aws ec2 get-managed-prefix-list-entries \
                --prefix-list-id "$prefix_list_id" \
                --region "$REGION" \
                --query "Entries[?Cidr=='$cidr'] | [0]" \
                --output json 2>/dev/null || true)

              if [[ "$observed_json" == "null" || "$observed_json" == "" ]]; then
                echo "Runner CIDR is no longer present in the prefix list."
                return 0
              fi

              echo "Waiting for runner CIDR to be removed from the prefix list [attempt ${wait_attempt}/${max_wait_attempts}]..."
              sleep 5
              ((wait_attempt++))
            done

            echo "Timed out waiting for runner CIDR to be removed from the prefix list."
            return 1
          }

          local max_retries=37
          local attempt=1

          while true; do
            current_version=$(aws ec2 describe-managed-prefix-lists \
              --prefix-list-ids "$prefix_list_id" \
              --region "$REGION" \
              --query "PrefixLists[0].Version" --output text)

            entry_json=$(aws ec2 get-managed-prefix-list-entries \
              --prefix-list-id "$prefix_list_id" \
              --region "$REGION" \
              --query "Entries[?Cidr=='$cidr'] | [0]" \
              --output json)

            if [[ "$entry_json" == "null" ]]; then
              echo "Runner IP not present in prefix list, Skipping..."
              break
            else
              current_desc=$(echo "$entry_json" | jq -r '.Description // ""')
              current_count=$(get_refcount "$current_desc")

              set +e
              if (( current_count > 1 )); then
                new_count=$((current_count - 1))
                echo "Decrementing runner refcount to $new_count [attempt $attempt]..."
                output=$(aws ec2 modify-managed-prefix-list \
                  --prefix-list-id "$prefix_list_id" \
                  --region "$REGION" \
                  --current-version "$current_version" \
                  --remove-entries "Cidr=$cidr" \
                  --add-entries "Cidr=$cidr,Description=${base_desc}:${new_count}" 2>&1)
                exit_code=$?
              else
                echo "Removing runner from prefix list [attempt $attempt]..."
                output=$(aws ec2 modify-managed-prefix-list \
                  --prefix-list-id "$prefix_list_id" \
                  --region "$REGION" \
                  --current-version "$current_version" \
                  --remove-entries "Cidr=$cidr" 2>&1)
                exit_code=$?
              fi
              set -e

              if [[ $exit_code -eq 0 ]]; then
                prefix_list_id_out=$(echo "$output" | jq -r '.PrefixList.PrefixListId')
                prefix_list_arn_out=$(echo "$output" | jq -r '.PrefixList.PrefixListArn')

                echo "::add-mask::$prefix_list_id_out"
                echo "::add-mask::$prefix_list_arn_out"

                echo "Runner prefix-list reference successfully updated."
                if ! wait_for_entry_removal 12; then
                  exit 1
                fi
                break
              else
                if echo "$output" | grep -q "PrefixListVersionMismatch"; then
                  echo "Version mismatch detected, retrying..."
                  ((attempt++))
                elif echo "$output" | grep -q "IncorrectState"; then
                  echo "Prefix list modify in progress, retrying..."
                  ((attempt++))
                else
                  echo "Error removing runner: $output"
                  exit $exit_code
                fi

                if (( attempt > max_retries )); then
                  echo "Max retries reached, failed."
                  exit $exit_code
                fi

                sleep 2
                continue
              fi
            fi
          done
        }

        remove_ip_from_prefix_list "$PREFIX_LIST_ID" "$RUNNER_IPV4/32"

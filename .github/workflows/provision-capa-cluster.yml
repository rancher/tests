name: Provision CAPA Cluster

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rancher_url:
        description: "Rancher server URL"
        required: true
        type: string
      rancher_token:
        description: "Rancher API token"
        required: true
        type: string
      k8s_version:
        description: "RKE2 version (blank = latest version available from this Rancher server)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    name: Provision AWS cluster through Rancher CAPA
    runs-on: ubuntu-latest
    environment: capa

    env:
      RANCHER_URL: ${{ secrets.RANCHER_URL_TESTING }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_AMI: ${{ secrets.AWS_AMI }}
      AWS_SSH_KEY_NAME: ${{ secrets.SSH_PRIVATE_KEY_NAME }}
      AWS_VPC_ID: ${{ secrets.AWS_VPC_ID }}
      AWS_SUBNET_ID: ${{ secrets.AWS_SUBNET_ID }}
      AWS_SG: ${{ secrets.AWS_SG }}
      NAMESPACE: fleet-default
      CAPA_NAMESPACE: capa-system
      INSTANCE_TYPE: t3.large

    steps:
      - name: Mask Rancher token
        shell: bash
        env:
          RANCHER_TOKEN_INPUT: ${{ secrets.RANCHER_TOKEN_TESTING }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RANCHER_TOKEN_INPUT"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate configuration
        shell: bash
        env:
          RANCHER_TOKEN_INPUT: ${{ secrets.RANCHER_TOKEN_TESTING }}
        run: |
          set -euo pipefail

          for name in \
            RANCHER_URL \
            AWS_REGION \
            AWS_AMI \
            AWS_SSH_KEY_NAME \
            AWS_VPC_ID \
            AWS_SUBNET_ID \
            AWS_SG
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required configuration is empty: $name"
              exit 1
            fi
          done

          if [[ -z "$RANCHER_TOKEN_INPUT" ]]; then
            echo "::error::Rancher token is required."
            exit 1
          fi

          RANCHER_URL="${RANCHER_URL%/}"
          CLUSTER_NAME="gha-capa-${GITHUB_RUN_NUMBER}"

          {
            echo "RANCHER_URL=$RANCHER_URL"
            echo "CLUSTER_NAME=$CLUSTER_NAME"
          } >> "$GITHUB_ENV"

          echo "Cluster name: $CLUSTER_NAME"
          echo "AWS region: $AWS_REGION"
          echo "CAPA namespace: $CAPA_NAMESPACE"
          echo "Provisioning namespace: $NAMESPACE"

      - name: Set up kubectl
        uses: azure/setup-kubectl@15650b3ad78fff148532a140b8a4c821796b2d7b # v5

      - name: Install workflow dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gettext-base jq

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 14400

      - name: Configure kubectl for Rancher
        shell: bash
        env:
          RANCHER_TOKEN_INPUT: ${{ secrets.RANCHER_TOKEN_TESTING }}
        run: |
          set -euo pipefail
          umask 077

          kubectl config set-cluster rancher \
            --server="${RANCHER_URL}/k8s/clusters/local" \
            --insecure-skip-tls-verify=true \
            --kubeconfig="$RUNNER_TEMP/rancher-kubeconfig"

          kubectl config set-credentials rancher \
            --token="$RANCHER_TOKEN_INPUT" \
            --kubeconfig="$RUNNER_TEMP/rancher-kubeconfig"

          kubectl config set-context rancher \
            --cluster=rancher \
            --user=rancher \
            --kubeconfig="$RUNNER_TEMP/rancher-kubeconfig"

          kubectl config use-context rancher \
            --kubeconfig="$RUNNER_TEMP/rancher-kubeconfig"

          echo "KUBECONFIG=$RUNNER_TEMP/rancher-kubeconfig" >> "$GITHUB_ENV"

      - name: Verify Rancher access and prerequisites
        shell: bash
        run: |
          set -euo pipefail

          kubectl get --raw=/version
          kubectl get namespace "$NAMESPACE"
          kubectl get crd clusters.provisioning.cattle.io
          kubectl get crd capiproviders.turtles-capi.cattle.io
          kubectl get crd clusters.cluster.x-k8s.io

      - name: Resolve RKE2 version
        shell: bash
        env:
          K8S_VERSION_INPUT: ${{ inputs.k8s_version }}
          RANCHER_TOKEN_INPUT: ${{ secrets.RANCHER_TOKEN_TESTING }}
        run: |
          set -euo pipefail

          requested_version="$(printf '%s' "$K8S_VERSION_INPUT" | xargs)"

          if [[ -n "$requested_version" ]]; then
            if [[ ! "$requested_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+$ ]]; then
              echo "::error::Invalid RKE2 version format. Expected vX.Y.Z+rke2rN."
              exit 1
            fi

            resolved_version="$requested_version"
          else
            echo "Querying Rancher for available RKE2 releases."

            releases_json="$RUNNER_TEMP/rke2-releases.json"

            http_status="$(
              curl --silent --show-error --location \
                --retry 3 \
                --retry-delay 2 \
                --output "$releases_json" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $RANCHER_TOKEN_INPUT" \
                --header "Accept: application/json" \
                "$RANCHER_URL/v1-rke2-release/releases"
            )"

            if [[ "$http_status" != "200" ]]; then
              echo "::error::Rancher RKE2 release API returned HTTP $http_status."
              exit 1
            fi

            mapfile -t available_versions < <(
              jq -r '
                [
                  .. | strings |
                  select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\+rke2r[0-9]+$"))
                ] | unique[]
              ' "$releases_json" |
              sort -Vu
            )

            if [[ "${#available_versions[@]}" -eq 0 ]]; then
              echo "::error::No stable RKE2 versions found in Rancher release metadata."
              exit 1
            fi

            resolved_version="${available_versions[-1]}"
          fi

          echo "K8S_VERSION=$resolved_version" >> "$GITHUB_ENV"
          echo "Selected RKE2 version: $resolved_version"

      - name: Install CAPA provider if missing
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          : "${AWS_ACCESS_KEY_ID:?Missing OIDC access key}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing OIDC secret key}"
          : "${AWS_SESSION_TOKEN:?Missing OIDC session token}"

          CREDENTIALS_FILE="$RUNNER_TEMP/capa-aws-credentials"
          trap 'rm -f "$CREDENTIALS_FILE"' EXIT

          cat > "$CREDENTIALS_FILE" <<EOF
          [default]
          aws_access_key_id = ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
          aws_session_token = ${AWS_SESSION_TOKEN}
          EOF

          ENCODED_CREDENTIALS="$(base64 -w 0 < "$CREDENTIALS_FILE")"

          if [[ -z "$ENCODED_CREDENTIALS" ]]; then
            echo "::error::Encoded AWS credentials are empty."
            exit 1
          fi

          kubectl get namespace "$CAPA_NAMESPACE" >/dev/null 2>&1 ||
            kubectl create namespace "$CAPA_NAMESPACE"

          PROVIDER_RESOURCE="capiproviders.turtles-capi.cattle.io"

          if ! kubectl -n "$CAPA_NAMESPACE" get "$PROVIDER_RESOURCE/aws" >/dev/null 2>&1; then
            jq -n \
              --arg namespace "$CAPA_NAMESPACE" \
              --arg credentials "$ENCODED_CREDENTIALS" \
              '{
                apiVersion: "turtles-capi.cattle.io/v1alpha1",
                kind: "CAPIProvider",
                metadata: {
                  name: "aws",
                  namespace: $namespace
                },
                spec: {
                  type: "infrastructure",
                  variables: {
                    AWS_B64ENCODED_CREDENTIALS: $credentials
                  }
                }
              }' |
              kubectl apply -f -
          else
            echo "CAPA provider already exists; credentials will be refreshed before readiness checks."
          fi

      - name: Configure CAPA bootstrap credentials and role identity
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.IAM_ROLE }}
        run: |
          set -euo pipefail
          umask 077

          CREDENTIALS_FILE="$RUNNER_TEMP/capa-aws-credentials"
          trap 'rm -f "$CREDENTIALS_FILE"' EXIT

          : "${AWS_ACCESS_KEY_ID:?Missing OIDC access key}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing OIDC secret key}"
          : "${AWS_SESSION_TOKEN:?Missing OIDC session token}"
          : "${AWS_ROLE_ARN:?Missing CAPA IAM role ARN}"

          cat > "$CREDENTIALS_FILE" <<EOF
          [default]
          aws_access_key_id = ${AWS_ACCESS_KEY_ID}
          aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
          aws_session_token = ${AWS_SESSION_TOKEN}
          EOF

          ENCODED_CREDENTIALS="$(base64 -w 0 < "$CREDENTIALS_FILE")"

          kubectl patch capiproviders.turtles-capi.cattle.io aws \
            --namespace "$CAPA_NAMESPACE" \
            --type=merge \
            -p "$(jq -n --arg credentials "$ENCODED_CREDENTIALS" \
              '{spec:{variables:{AWS_B64ENCODED_CREDENTIALS:$credentials}}}')"

          echo "Waiting for CAPA controller deployment."

          kubectl -n "$CAPA_NAMESPACE" rollout status \
            deployment/capa-controller-manager \
            --timeout=15m

          echo "Polling CAPA provider status."

          provider_ready=false

          for attempt in $(seq 1 60); do
            provider_json="$(
              kubectl -n "$CAPA_NAMESPACE" \
                get capiproviders.turtles-capi.cattle.io/aws -o json
            )"

            provider_phase="$(
              jq -r '.status.phase // "Unknown"' <<< "$provider_json"
            )"

            provider_condition="$(
              jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // "Unknown"' \
                <<< "$provider_json"
            )"

            if [[ "$provider_phase" == "Ready" &&
                  "$provider_condition" == "True" ]]; then
              provider_ready=true
              echo "CAPA provider is Ready."
              break
            fi

            echo "CAPA provider not ready (phase=$provider_phase, Ready=$provider_condition; attempt $attempt/60)."
            sleep 5
          done

          if [[ "$provider_ready" != true ]]; then
            echo "::error::CAPA provider did not become Ready within 5 minutes."
            kubectl -n "$CAPA_NAMESPACE" \
              get capiproviders.turtles-capi.cattle.io/aws -o yaml
            exit 1
          fi

          echo "Waiting for CAPA bootstrap credentials."

          credentials=""

          for attempt in $(seq 1 60); do
            credentials="$(
              kubectl get secret capa-manager-bootstrap-credentials \
                --namespace "$CAPA_NAMESPACE" \
                -o jsonpath='{.data.credentials}' 2>/dev/null || true
            )"

            if [[ -n "$credentials" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "$credentials" ]]; then
            echo "::error::CAPA bootstrap credentials were not populated."
            exit 1
          fi

          kubectl rollout restart deployment/capa-controller-manager \
            --namespace "$CAPA_NAMESPACE"

          kubectl rollout status deployment/capa-controller-manager \
            --namespace "$CAPA_NAMESPACE" \
            --timeout=5m

          cat <<YAML | kubectl apply -f -
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: AWSClusterControllerIdentity
          metadata:
            name: default
          spec:
            allowedNamespaces:
              list:
                - ${NAMESPACE}
          ---
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: AWSClusterRoleIdentity
          metadata:
            name: rancher-tests-gha-role
          spec:
            roleARN: ${AWS_ROLE_ARN}
            sourceIdentityRef:
              kind: AWSClusterControllerIdentity
              name: default
            allowedNamespaces:
              list:
                - ${NAMESPACE}
          YAML

          echo "CAPA bootstrap credentials and role identity configured."

      - name: Render manifests
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_DIR="$RUNNER_TEMP/capa-manifests"
          mkdir -p "$MANIFEST_DIR"

          cat > "$MANIFEST_DIR/aws-cluster.yaml.tmpl" <<'EOF'
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: AWSCluster
          metadata:
            name: ${CLUSTER_NAME}
            namespace: ${NAMESPACE}
          spec:
            identityRef:
              kind: AWSClusterRoleIdentity
              name: rancher-tests-gha-role
            region: ${AWS_REGION}
            network:
              vpc:
                id: ${AWS_VPC_ID}
              subnets:
                - id: ${AWS_SUBNET_ID}
              securityGroupOverrides:
                controlplane: ${AWS_SG}
                node: ${AWS_SG}
            controlPlaneLoadBalancer:
              subnets:
                - ${AWS_SUBNET_ID}
          EOF

          envsubst '${CLUSTER_NAME} ${NAMESPACE} ${AWS_REGION} ${AWS_VPC_ID} ${AWS_SUBNET_ID} ${AWS_SG}' \
            < "$MANIFEST_DIR/aws-cluster.yaml.tmpl" \
            > "$MANIFEST_DIR/aws-cluster.yaml"

          for pool in etcd control-plane worker; do
            case "$pool" in
              control-plane)
                AWS_IAM_PROFILE="control-plane.cluster-api-provider-aws.sigs.k8s.io"
                ;;
              *)
                AWS_IAM_PROFILE="nodes.cluster-api-provider-aws.sigs.k8s.io"
                ;;
            esac
            export AWS_IAM_PROFILE

            cat > "$MANIFEST_DIR/aws-machine-template-${pool}.yaml.tmpl" <<'EOF'
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
          kind: AWSMachineTemplate
          metadata:
            name: ${CLUSTER_NAME}-${POOL_NAME}
            namespace: ${NAMESPACE}
          spec:
            template:
              spec:
                ami:
                  id: ${AWS_AMI}
                instanceType: ${INSTANCE_TYPE}
                iamInstanceProfile: ${AWS_IAM_PROFILE}
                sshKeyName: ${AWS_SSH_KEY_NAME}
                rootVolume:
                  size: 30
                publicIP: true
                cloudInit:
                  insecureSkipSecretsManager: true
          EOF

            sed "s/\${POOL_NAME}/${pool}/g" \
              "$MANIFEST_DIR/aws-machine-template-${pool}.yaml.tmpl" \
              > "$MANIFEST_DIR/aws-machine-template-${pool}.yaml.pool"

            envsubst '${CLUSTER_NAME} ${NAMESPACE} ${AWS_AMI} ${INSTANCE_TYPE} ${AWS_IAM_PROFILE} ${AWS_SSH_KEY_NAME}' \
              < "$MANIFEST_DIR/aws-machine-template-${pool}.yaml.pool" \
              > "$MANIFEST_DIR/aws-machine-template-${pool}.yaml"

            rm "$MANIFEST_DIR/aws-machine-template-${pool}.yaml.pool"
          done

          cat > "$RUNNER_TEMP/capa-cluster.yaml.tmpl" <<'EOF'
          apiVersion: provisioning.cattle.io/v1
          kind: Cluster
          metadata:
            name: ${CLUSTER_NAME}
            namespace: ${NAMESPACE}
          spec:
            kubernetesVersion: ${K8S_VERSION}
            rkeConfig:
              machineGlobalConfig:
                cni: calico
                disable-kube-proxy: false
                disable:
                  - rke2-metrics-server
                etcd-expose-metrics: false
                cloud-provider-name: external
                protect-kernel-defaults: false
              infrastructureRef:
                apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
                kind: AWSCluster
                name: ${CLUSTER_NAME}
              machinePools:
                - name: etcd
                  quantity: 3
                  controlPlaneRole: false
                  etcdRole: true
                  workerRole: false
                  machineConfigRef:
                    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
                    kind: AWSMachineTemplate
                    name: ${CLUSTER_NAME}-etcd
                    namespace: ${NAMESPACE}
                - name: control-plane
                  quantity: 2
                  controlPlaneRole: true
                  etcdRole: false
                  workerRole: false
                  machineConfigRef:
                    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
                    kind: AWSMachineTemplate
                    name: ${CLUSTER_NAME}-control-plane
                    namespace: ${NAMESPACE}
                - name: worker
                  quantity: 3
                  controlPlaneRole: false
                  etcdRole: false
                  workerRole: true
                  machineConfigRef:
                    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
                    kind: AWSMachineTemplate
                    name: ${CLUSTER_NAME}-worker
                    namespace: ${NAMESPACE}
              additionalManifest: |
                apiVersion: helm.cattle.io/v1
                kind: HelmChart
                metadata:
                  name: aws-cloud-controller-manager
                  namespace: kube-system
                spec:
                  chart: aws-cloud-controller-manager
                  repo: https://kubernetes.github.io/cloud-provider-aws
                  targetNamespace: kube-system
                  bootstrap: true
                  valuesContent: |-
                    hostNetworking: true
                    nodeSelector:
                      node-role.kubernetes.io/control-plane: "true"
                    args:
                      - --configure-cloud-routes=false
                      - --v=5
                      - --cloud-provider=aws
          EOF

          envsubst '${CLUSTER_NAME} ${NAMESPACE} ${K8S_VERSION}' \
            < "$RUNNER_TEMP/capa-cluster.yaml.tmpl" \
            > "$RUNNER_TEMP/capa-cluster.yaml"

          echo "Rendered AWSCluster with VPC ${AWS_VPC_ID}, subnet ${AWS_SUBNET_ID}, and explicit security-group overrides."
          echo "Rendered control-plane and node AWSMachineTemplates with separate IAM instance profiles."
          echo "Rendered Rancher Cluster manifest for RKE2 $K8S_VERSION."

      - name: Provision cluster
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST_DIR="$RUNNER_TEMP/capa-manifests"

          echo "Creating AWSCluster $CLUSTER_NAME"
          kubectl apply -f "$MANIFEST_DIR/aws-cluster.yaml"

          echo "Waiting for CAPA to retain the requested subnet ID."

          subnet_valid=false

          for attempt in $(seq 1 60); do
            awscluster_json="$(
              kubectl -n "$NAMESPACE" \
                get awscluster.infrastructure.cluster.x-k8s.io "$CLUSTER_NAME" -o json
            )"

            actual_subnet="$(jq -c '.spec.network.subnets[0] // {}' <<< "$awscluster_json")"

            if jq -e --arg id "$AWS_SUBNET_ID" '.id == $id' \
              <<< "$actual_subnet" >/dev/null; then
              subnet_valid=true
              break
            fi

            sleep 2
          done

          if [[ "$subnet_valid" != true ]]; then
            echo "::error::CAPA did not retain the requested subnet ID."
            echo "Expected subnet: $AWS_SUBNET_ID"
            echo "Actual subnet configuration:"
            jq '.spec.network.subnets' <<< "$awscluster_json"
            echo "No machine templates or Rancher Cluster will be created."
            exit 1
          fi

          echo "CAPA retained the requested subnet ID."
          echo "Live subnet configuration:"
          jq '.spec.network.subnets' <<< "$awscluster_json"

          for pool in etcd control-plane worker; do
            echo "Creating AWSMachineTemplate for ${pool}"
            kubectl apply \
              -f "$MANIFEST_DIR/aws-machine-template-${pool}.yaml"
          done

          echo "Creating Rancher cluster $CLUSTER_NAME with RKE2 $K8S_VERSION"
          kubectl apply -f "$RUNNER_TEMP/capa-cluster.yaml"

      - name: Wait for cluster readiness
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 5400))

          while (( SECONDS < deadline )); do
            ready="$(
              kubectl -n "$NAMESPACE" \
                get "clusters.provisioning.cattle.io/$CLUSTER_NAME" \
                -o json |
              jq -r '
                [.status.conditions[]? | select(.type == "Ready") | .status][0] // "Unknown"
              '
            )"

            if [[ "$ready" == "True" ]]; then
              echo "Cluster $CLUSTER_NAME is Ready."
              exit 0
            fi

            echo "Cluster readiness is $ready; checking again in 30 seconds."
            sleep 30
          done

          echo "::error::Timed out waiting for cluster $CLUSTER_NAME to become Ready."
          kubectl -n "$NAMESPACE" \
            describe "clusters.provisioning.cattle.io/$CLUSTER_NAME" || true
          exit 1

      - name: Clean up temporary files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            "$RUNNER_TEMP/rancher-kubeconfig" \
            "$RUNNER_TEMP/rke2-releases.json" \
            "$RUNNER_TEMP/capa-aws-credentials" \
            "$RUNNER_TEMP/capa-cluster.yaml.tmpl" \
            "$RUNNER_TEMP/capa-cluster.yaml"

          rm -rf "$RUNNER_TEMP/capa-manifests"

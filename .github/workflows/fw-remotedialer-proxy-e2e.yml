name: Remotedialer Proxy Rancher E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rancher_version:
        description: Host Rancher version to install (no leading "v")
        required: true
      qase_test_run_id:
        description: Existing Qase test run ID to reuse instead of creating a new run
        required: false
        type: string
        default: ""
      cleanup:
        description: Destroy AWS infra when the job finishes
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  RUNWAY_REF: main
  RUNWAY_SETUP_TEST_FUNC: "TestHaSetup"
  RUNWAY_CLEANUP_TEST_FUNC: "TestHACleanup"

jobs:
  remotedialer-proxy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: fw-hosted-tenant

    steps:
      - name: Checkout rancher/tests
        uses: actions/checkout@v4

      - name: Checkout rancher-runway
        uses: actions/checkout@v4
        with:
          repository: brudnak/rancher-runway
          ref: ${{ env.RUNWAY_REF }}
          path: runway

      - name: Setup Go (rancher-runway)
        uses: actions/setup-go@v5
        with:
          go-version-file: runway/go.mod
          cache: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.22.0"

      - name: Verify Helm
        run: helm version

      - name: Setup kubectl
        uses: azure/setup-kubectl@15650b3ad78fff148532a140b8a4c821796b2d7b #v5
        with:
          version: "latest"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa #v3
        with:
          secret-ids: |
            AWS_ACCESS_KEY, ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_KEY, ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up SSH Keys
        uses: ./.github/actions/setup-ssh-keys
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-private-key-name: ${{ secrets.SSH_PRIVATE_KEY_NAME }}
          windows-ssh-private-key: ${{ secrets.WINDOWS_SSH_PRIVATE_KEY }}
          windows-ssh-private-key-name: ${{ secrets.WINDOWS_SSH_PRIVATE_KEY_NAME }}

      - name: Write tool-config.yml
        working-directory: runway
        env:
          # HOST_VERSION: ${{ github.event.inputs.rancher_version }}
          HOST_VERSION: "2.15.2-717f00a-head"
          STAGING_REGISTRY: ${{ secrets.STAGING_REGISTRY }}
          BOOTSTRAP_PASSWORD: ${{ secrets.RANCHER_BOOTSTRAP_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_PREFIX: ${{ secrets.AWS_PREFIX }}
          AWS_VPC: ${{ secrets.AWS_VPC }}
          AWS_SUBNET_A: ${{ secrets.AWS_SUBNET_A }}
          AWS_SUBNET_B: ${{ secrets.AWS_SUBNET_B }}
          AWS_SUBNET_C: ${{ secrets.AWS_SUBNET_C }}
          AWS_AMI: ${{ secrets.AWS_AMI }}
          AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          AWS_PEM_KEY_NAME: ${{ secrets.AWS_PEM_KEY_NAME }}
          AWS_ROUTE53_FQDN: ${{ secrets.AWS_ROUTE53_FQDN }}
          AWS_RDS_PASSWORD: ${{ secrets.AWS_RDS_PASSWORD }}
          AWS_EC2_INSTANCE_TYPE: ${{ secrets.AWS_EC2_INSTANCE_TYPE }}
        run: |
          set -euo pipefail
          cat > tool-config.yml <<EOF
          rancher:
            mode: "auto"
            versions:
              - "${HOST_VERSION}"
            distro: "auto"
            bootstrap_password: "${BOOTSTRAP_PASSWORD}"
            auto_approve: true
            preferred_image_registries:
              - "${STAGING_REGISTRY}"
              - "docker.io"

          deployment:
            type: "ha-rke2"

          k3s:
            preload_images: false

          rke2:
            preload_images: false
            server_count: 3

          total_has: 1

          user:
            first_name: "automation"
            last_name: "services"

          tf_vars:
            aws_region: "${AWS_REGION}"
            aws_prefix: "${AWS_PREFIX}"
            aws_vpc: "${AWS_VPC}"
            aws_subnet_a: "${AWS_SUBNET_A}"
            aws_subnet_b: "${AWS_SUBNET_B}"
            aws_subnet_c: "${AWS_SUBNET_C}"
            aws_ami: "${AWS_AMI}"
            aws_subnet_id: "${AWS_SUBNET_A}"
            aws_security_group_id: "${AWS_SECURITY_GROUP_ID}"
            aws_pem_key_name: "${AWS_PEM_KEY_NAME}"
            aws_route53_fqdn: "${AWS_ROUTE53_FQDN}"
            aws_rds_password: "${AWS_RDS_PASSWORD}"
            aws_ec2_instance_type: "${AWS_EC2_INSTANCE_TYPE}"
          EOF

          yq eval '.' tool-config.yml > /dev/null
          echo "tool-config.yml written and parsed OK"

      - name: Provision HA RKE2 Rancher
        working-directory: runway
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
          TF_STATE_REGION: ${{ secrets.AWS_REGION }}
          TF_STATE_KEY: "rancher-runway-${{ github.run_id }}.tfstate"
        run: |
          set -euo pipefail
          .github/scripts/run-with-cancel-cleanup.sh \
            go test -v -run "^${RUNWAY_SETUP_TEST_FUNC}\$" -timeout 90m ./terratest \
            | tee provision.log \
            | sed -E 's#(https://)[a-zA-Z0-9.-]+#\1[REDACTED]#g'

      - name: Grab Rancher URL
        id: urls
        working-directory: runway
        run: |
          set -euo pipefail

          host_url="$(terraform -chdir=modules/aws output -json flat_outputs \
            | jq -er '.ha_1_rancher_url' || true)"

          if [ -z "$host_url" ] || [ "$host_url" = "null" ]; then
            echo "::error::Could not read 'ha_1_rancher_url' from terraform output (modules/aws)."
            exit 1
          fi

          echo "::add-mask::$host_url"

          echo "host_url=${host_url}" >> "$GITHUB_OUTPUT"

      - name: Create admin token
        id: tokens
        env:
          BOOTSTRAP_PASSWORD: ${{ secrets.RANCHER_BOOTSTRAP_PASSWORD }}
          HOST_URL: ${{ steps.urls.outputs.host_url }}
        run: |
          set -euo pipefail

          create_token() {
            local url="$1"
            local login_payload login_response login_token token_response token
            local max_attempts=30
            local delay=15

            echo "Creating admin token for Rancher endpoint: ${url}" >&2

            login_payload="$(jq -n --arg pw "$BOOTSTRAP_PASSWORD" \
              '{username:"admin", password:$pw, responseType:"json"}')"

            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              echo "Attempt $attempt/$max_attempts: Attempting login to Rancher..." >&2

              login_response_raw="$(curl -skS -w "\n%{http_code}" -X POST \
                "https://${url}/v3-public/localProviders/local?action=login" \
                -H 'Content-Type: application/json' \
                -d "$login_payload" || true)"

              http_code="$(echo "$login_response_raw" | tail -n1)"
              login_response="$(echo "$login_response_raw" | sed '$d')"

              if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
                if login_token="$(jq -er '.token // empty' <<< "$login_response" 2>/dev/null)"; then
                  if [ -n "$login_token" ] && [ "$login_token" != "null" ]; then
                    echo "Successfully logged in!" >&2
                    break
                  fi
                fi
              fi

              echo "Rancher not ready yet (HTTP status: ${http_code}), waiting ${delay}s..." >&2
              sleep "$delay"
            done

            if [ -z "${login_token:-}" ] || [ "$login_token" = "null" ]; then
              echo "::error::Rancher failed to become ready or returned an unexpected response after $((max_attempts * delay)) seconds." >&2
              exit 1
            fi

            token_response="$(curl -skS --fail-with-body -X POST \
              "https://${url}/v3/token" \
              -H "Authorization: Bearer ${login_token}" \
              -H 'Content-Type: application/json' \
              -d '{"type":"token","description":"gha-ha-rke2-remotedialer"}')"

            if ! token="$(jq -er '.token // empty' <<< "$token_response")"; then
              echo "::error::Rancher token creation returned an unexpected response for ${url}." >&2
              exit 1
            fi

            if [ -z "$token" ] || [ "$token" = "null" ]; then
              echo "::error::Rancher token creation response did not contain a token for ${url}." >&2
              exit 1
            fi

            printf '%s\n' "$token"
          }

          host_token="$(create_token "$HOST_URL")"

          echo "::add-mask::$host_token"

          {
            echo "host_token<<TOKEN_EOF"
            echo "$host_token"
            echo "TOKEN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Rancher Readiness
        working-directory: runway
        env:
          HOST_URL: ${{ steps.urls.outputs.host_url }}
          HOST_TOKEN: ${{ steps.tokens.outputs.host_token }}
        run: |
          set -euo pipefail
          echo "Waiting for Rancher core components in cattle-system..."

          deployments=("rancher-webhook" "system-upgrade-controller")

          for dep in "${deployments[@]}"; do
            echo "Checking deployment: ${dep}..."
            ready=false
            
            for i in {1..50}; do
              # Directly check if the deployment's 'Available' condition is True
              available_status=$(kubectl get deployment "${dep}" -n cattle-system -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || echo "False")

              if [ "$available_status" = "True" ]; then
                echo "-> ${dep} is ready (Available condition is True)."
                ready=true
                break
              fi

              echo "-> ${dep} not ready yet (status: ${available_status}), retrying in 15s (${i}/50)..."
              sleep 15
            done

            if [ "$ready" = false ]; then
              echo "::error::Deployment '${dep}' failed to become ready in time."
              exit 1
            fi
          done

          echo "All core Rancher components are up and running!"

      - name: Write cattle-config.yaml
        id: cattle_config
        env:
          HOST_URL: ${{ steps.urls.outputs.host_url }}
          HOST_TOKEN: ${{ steps.tokens.outputs.host_token }}
          PROVIDER_AMAZON: ${{ secrets.PROVIDER_AMAZON }}
          NODE_PROVIDER_AMAZON: ${{ secrets.NODE_PROVIDER_AMAZON }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IAM_PROFILE: ${{ secrets.IAM_PROFILE }}
          AWS_VPC: ${{ secrets.AWS_VPC }}
          AWS_SUBNET_A: ${{ secrets.AWS_SUBNET_A }}
          AWS_AMI: ${{ secrets.AWS_AMI }}
          SSH_USER: ${{ secrets.SSH_USER }}
          AWS_VOLUME_TYPE: ${{ secrets.AWS_VOLUME_TYPE }}
          AWS_ZONE: ${{ vars.AWS_ZONE }}
          AWS_ROOT_SIZE: ${{ secrets.AWS_ROOT_SIZE }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          AWS_PEM_KEY_NAME: ${{ secrets.AWS_PEM_KEY_NAME }}
          PATH_TO_REPO: ${{ github.workspace }}
          SSH_PRIVATE_KEY_PATH: ${{ secrets.SSH_PRIVATE_KEY_PATH }}
          AWS_TAG: ${{ secrets.AWS_TAG }}
        run: |
          set -euo pipefail
          cat > cattle-config.yaml <<EOF
          rancher:
            host: "${HOST_URL}"
            adminToken: "${HOST_TOKEN}"
            cleanup: true
            insecure: true

          clusterConfig:
            kubernetesVersion: ""
            provider: "${PROVIDER_AMAZON}"
            nodeProvider: "${NODE_PROVIDER_AMAZON}"
            hardened: false
            psact: ""
            pathToRepo: "${PATH_TO_REPO}"
            registries:
              rke2Registries:
                mirrors:
                  "docker.io":
                    endpoint: ["https://${DOCKER_REGISTRY}"]
                configs:
                  "${DOCKER_REGISTRY}":
                    "auth":
                      username: "${DOCKER_REGISTRY_USER}"
                      password: "${DOCKER_REGISTRY_PASSWORD}"

          awsMachineConfigs:
            region: "${AWS_REGION}"
            awsMachineConfig:
              - roles: ["etcd", "controlplane", "worker"]
                iamInstanceProfile: "${IAM_PROFILE}"
                ami: "${AWS_AMI}"
                sshUser: "${SSH_USER}"
                vpcId: "${AWS_VPC}"
                subnetId: "${AWS_SUBNET_A}"
                volumeType: "${AWS_VOLUME_TYPE}"
                zone: "${AWS_ZONE}"
                retries: "5"
                rootSize: "${AWS_ROOT_SIZE}"

          awsEC2Configs:
            region: "${AWS_REGION}"
            awsSecretAccessKey: "${AWS_SECRET_KEY}"
            awsAccessKeyID: "${AWS_ACCESS_KEY}"
            awsEC2Config:
              - awsRegionAZ: ""
                awsAMI: "${AWS_AMI}"
                awsSecurityGroups: ["${AWS_SECURITY_GROUP_ID}"]
                awsSSHKeyName: "${AWS_PEM_KEY_NAME}.pem"
                awsCICDInstanceTag: "${AWS_TAG}"
                awsIAMProfile: ""
                awsUser: "${SSH_USER}"
                volumeSize: ${AWS_ROOT_SIZE}
                roles: ["etcd", "controlplane", "worker"]

          awsCredentials:
            secretKey: "${AWS_SECRET_KEY}"
            accessKey: "${AWS_ACCESS_KEY}"
            defaultRegion: "${AWS_REGION}"

          sshPath:
            sshPath: "${SSH_PRIVATE_KEY_PATH}"

          logging:
            level: "info"
          EOF

          yq eval '.' cattle-config.yaml > /dev/null
          echo "cattle-config.yaml written and parsed OK"
          echo "path=$GITHUB_WORKSPACE/cattle-config.yaml" >> "$GITHUB_OUTPUT"

      - name: Setup Go (rancher/tests)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Format Qase milestone
        id: qase_milestone
        if: inputs.qase_test_run_id == ''
        run: |
          set -euo pipefail
          # version="${{ github.event.inputs.rancher_version }}"
          version="2.15.2-717f00a-head"
          base="${version%%-*}"
          echo "version=v${base}" >> "$GITHUB_OUTPUT"

      - name: Create Qase test run
        id: create-qase-run
        if: inputs.qase_test_run_id == ''
        uses: ./.github/actions/create-qase-test-run
        with:
          # test_run_name: "Remotedialer_Proxy - v${{ github.event.inputs.rancher_version }}"
          test_run_name: "Remotedialer_Proxy - v2.15.2-717f00a-head"
          qase_project_id: ${{ secrets.QASE_PROJECT_ID }}
          qase_token: ${{ secrets.QASE_AUTOMATION_TOKEN }}
          qase_milestone: ${{ steps.qase_milestone.outputs.version }}

      - name: Resolve Qase test run ID
        id: qase-run
        env:
          PROVIDED_RUN_ID: ${{ inputs.qase_test_run_id }}
          CREATED_RUN_ID: ${{ steps.create-qase-run.outputs.id }}
        run: |
          set -euo pipefail
          run_id="${PROVIDED_RUN_ID:-$CREATED_RUN_ID}"

          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Qase test run ID must be numeric."
            exit 1
          fi

          echo "id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Run RDP suite and report to Qase
        uses: ./.github/actions/run-test-suite
        env:
          CATTLE_TEST_CONFIG: ${{ steps.cattle_config.outputs.path }}
          QASE_TEST_RUN_ID: ${{ steps.qase-run.outputs.id }}
          QASE_AUTOMATION_TOKEN: ${{ secrets.QASE_AUTOMATION_TOKEN }}
          QASE_PROJECT_ID: ${{ secrets.QASE_PROJECT_ID }}
        with:
          package: "remotedialerproxy"
          reporting: "true"
          tag: "validation"
          test-suite: "^TestRemotedialerProxy$"
          timeout: "60m"

      - name: Close Qase test run
        if: env.test_exit_code == '0'
        uses: ./.github/actions/close-qase-test-run
        with:
          qase_run_id: ${{ steps.qase-run.outputs.id }}
          qase_project_id: ${{ secrets.QASE_PROJECT_ID }}
          qase_token: ${{ secrets.QASE_AUTOMATION_TOKEN }}

      - name: Warn if Qase test run left open
        if: always() && env.test_exit_code != '0'
        run: |
          echo "::warning::Qase run ${{ steps.qase-run.outputs.id }} left open due to test failure (exit code: ${test_exit_code:-unknown})."

      - name: Refetch AWS credentials for cleanup
        # if: always() && github.event.inputs.cleanup == 'true'
        if: always()
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Cleanup infrastructure
        # if: always() && github.event.inputs.cleanup == 'true'
        if: always()
        working-directory: runway/modules/aws/modules/rke2-ha
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
          TF_STATE_REGION: ${{ secrets.AWS_REGION }}
          TF_STATE_KEY: "rancher-runway-${{ github.run_id }}.tfstate"
          TF_VAR_aws_prefix: "${{ secrets.AWS_PREFIX }}"
          TF_VAR_aws_route53_fqdn: "${{ secrets.AWS_ROUTE53_FQDN }}"
          TF_VAR_aws_vpc: "${{ secrets.AWS_VPC }}"
          TF_VAR_aws_subnet_id: "${{ secrets.AWS_SUBNET_A }}"
          TF_VAR_aws_security_group_id: "${{ secrets.AWS_SECURITY_GROUP_ID }}"
          TF_VAR_aws_rds_password: "${{ secrets.AWS_RDS_PASSWORD }}"
          TF_VAR_aws_ami: "${{ secrets.AWS_AMI }}"
          TF_VAR_aws_ec2_instance_type: "${{ secrets.AWS_EC2_INSTANCE_TYPE }}"
          TF_VAR_aws_subnet_a: "${{ secrets.AWS_SUBNET_A }}"
          TF_VAR_aws_subnet_b: "${{ secrets.AWS_SUBNET_B }}"
          TF_VAR_aws_subnet_c: "${{ secrets.AWS_SUBNET_C }}"
          TF_VAR_aws_pem_key_name: "${{ secrets.AWS_PEM_KEY_NAME }}"
          TF_VAR_common_tags: '{"Environment": "${{ secrets.AWS_TAG }}"}'
        run: |
          set -euo pipefail
          cat <<EOF > backend.tf
          terraform {
            backend "s3" {}
          }
          EOF

          echo "Initializing Terraform Backend"
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -reconfigure -input=false -no-color > /dev/null 2>&1

          echo "Destroying Infrastructure"
          terraform destroy -auto-approve -input=false -no-color > /dev/null 2>&1 || true
          echo "Cleanup Complete"

      - name: Warn of disabled cleanup
        if: always() && github.event.inputs.cleanup != 'true'
        run: echo "::warning::cleanup=${{ github.event.inputs.cleanup }} -- AWS resources are still running. Destroy them manually when done."

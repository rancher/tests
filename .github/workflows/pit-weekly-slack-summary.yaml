---
name: PIT Weekly Slack Summary

on:
  schedule:
    # Run every Saturday at 6 AM UTC
    - cron: "0 6 * * 6"
  workflow_dispatch: {}

jobs:
  pit-weekly-slack-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send PIT weekly summary to Slack
        uses: ./.github/actions/pit-weekly-slack-summary
        with:
          qase-automation-token: ${{ secrets.QASE_AUTOMATION_TOKEN }}
          slack-webhook-url: ${{ secrets.PIT_SLACK_WEBHOOK_URL }}

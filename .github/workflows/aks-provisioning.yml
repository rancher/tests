              rancherChartRepository: "${{ secrets.RANCHER_HELM_CHART_URL }}"
              rancherHostname: "${{ env.HOSTNAME_PREFIX }}.${{ vars.AZURE_LOCATION }}.cloudapp.azure.com"
              rancherImage: "${{ secrets.RANCHER_IMAGE }}"
              rancherTagVersion: "${{ env.RANCHER_VERSION }}"
              registryUsername: "${{ env.DOCKERHUB_USERNAME }}"
              registryPassword: "${{ env.DOCKERHUB_PASSWORD }}"
              repo: "${{ secrets.RANCHER_REPO }}"
          terratest:
            pathToRepo: "${{ secrets.PATH_TO_REPO }}"
            standaloneLogging: ${{ vars.TERRAFORM_LOGGING }}

          logging:
            level: "${{ vars.LOGGING_LEVEL }}"
          
          azureCredentials: 
            clientId: "${{ secrets.AZURE_CLIENT_ID }}"
            clientSecret: "${{ secrets.AZURE_CLIENT_SECRET }}"
            subscriptionId: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            environment: "AzurePublicCloud"

          aksClusterConfig:
            dnsPrefix: "${{ env.HOSTNAME_PREFIX }}"
            linuxAdminUsername: "${{ vars.AZURE_SSH_USER }}"
            loadBalancerSku: "Standard"
            networkPlugin: "kubenet"
            nodePools:
            - availabilityZones:
              - "1"
              - "2"
              - "3"
              enableAutoScaling: true
              maxPods: 110
              maxCount: 10
              minCount: 3
              mode: "System"
              name: "agentpool"
              nodeCount: 3
              osDiskSizeGB: 128
              osDiskType: "Managed"
              osType: "Linux"
              vmSize: "Standard_DS2_v2"
            resourceGroup: "${{ env.HOSTNAME_PREFIX }}-rg"
            resourceLocation: "${{ vars.AZURE_LOCATION }}"
            tags: {}
          EOF

      - name: Export CATTLE_TEST_CONFIG
        run: echo "CATTLE_TEST_CONFIG=${{ github.workspace }}/config.yaml" >> $GITHUB_ENV
        shell: bash

      - name: Set up Go environment
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6
        with:
          go-version-file: "./go.mod"

      - name: Build Packages

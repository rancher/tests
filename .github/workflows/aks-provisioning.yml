              osDiskSizeGB: 128
              outboundType: "loadBalancer"
              publisher: "${{ secrets.AZURE_PUBLISHER }}"
              resourceGroup: "${{ env.HOSTNAME_PREFIX }}-rg"
              resourceLocation: "${{ vars.AZURE_LOCATION }}"

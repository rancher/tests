              osGroup: "<HB_OS_GROUP>"
              rancherAgentImage: "<HB_RANCHER_AGENT_IMAGE>"
              rancherChartRepository: "<HB_RANCHER_HELM_CHART_URL>"
              rancherHostname: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
              rancherImage: "<HB_RANCHER_IMAGE>"
              rancherTagVersion: "${{ env.RANCHER_VERSION }}"
              registryPassword: "${{ env.DOCKERHUB_PASSWORD }}"

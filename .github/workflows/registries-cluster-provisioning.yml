      - name: AWS Custodian Downstream Cleanup - Node driver
        if: always()
        uses: ./.github/actions/aws-cleanup
        with:
          prefix: "auto-${{ env.HOSTNAME_PREFIX }}"
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"


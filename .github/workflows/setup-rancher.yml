---
name: Setup Rancher

on:
  workflow_dispatch:
    inputs:
      rancher_version:
        description: "Rancher tag version (i.e. v2.16-head, v2.15.3, etc)"
        required: true
      rancher_chart_version:
        description: "Rancher chart version (i.e. 2.15.3)"
        required: true
      hostname_prefix:
        description: "Hostname prefix for the Rancher instance"
        required: true
      rancher_password:
        description: "Rancher admin password"
        required: true
      rancher_type:
        description: "Rancher type to setup"
        required: true
        default: "prime"
        type: choice
        options:
          - prime
          - community
      community_version:
        description: "Rancher community version to setup (i.e. 2.17, 2.16, etc.)"
        required: false
        default: "2.16"
      local_cluster_type:
        description: "Local cluster type to setup Rancher"
        required: true
        default: "rke2"
        type: choice
        options:
          - k3s
          - rke2
      local_cluster_k8s_version:
        description: "Kubernetes version for the local cluster (i.e. v1.36.5, remove suffix)"
        required: true

permissions:
  id-token: write
  contents: read

env:
  CLOUD_PROVIDER_VERSION: "6.50.0"
  LOCAL_CLUSTER_TYPE: ${{ github.event.inputs.local_cluster_type }}
  LOCAL_CLUSTER_K8S_VERSION: ${{ github.event.inputs.local_cluster_k8s_version }}
  COMMUNITY_VERSION: ${{ github.event.inputs.community_version }}
  HOSTNAME_PREFIX: >-
    ${{ 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.hostname_prefix)
    }}
  RANCHER_PASSWORD: >-
    ${{ 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.rancher_password)
    }}

jobs:
  prepare-matrix-prime:
    if: (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.rancher_type, 'prime'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      RANCHER_VERSION_INPUT: ${{ github.event.inputs.rancher_version }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          environments='[]'
          case "$RANCHER_VERSION_INPUT" in
            head*) environments='[{"version":"17","environment":"prime-head"}]' ;;
            v2.16-head*) environments='[{"version":"16","environment":"prime-head"}]' ;;
            v2.15-head*) environments='[{"version":"15","environment":"prime-head"}]' ;;
            v2.14-head*) environments='[{"version":"14","environment":"prime-head"}]' ;;
            v2.16*-rc*) environments='[{"version":"16","environment":"staging-latest"}]' ;;
            v2.15*-rc*) environments='[{"version":"15","environment":"staging-latest"}]' ;;
            v2.14*-rc*) environments='[{"version":"14","environment":"staging-latest"}]' ;;
            v2.16.*) environments='[{"version":"16","environment":"prime"}]' ;;
            v2.15.*) environments='[{"version":"15","environment":"prime"}]' ;;
            v2.14.*) environments='[{"version":"14","environment":"prime"}]' ;;
          esac
          echo "matrix={\"include\":$environments}" >> "$GITHUB_OUTPUT"

  prepare-matrix-community:
    if: (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.rancher_type, 'community'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      RANCHER_VERSION_INPUT: ${{ github.event.inputs.rancher_version }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          environments='[]'
          case "$RANCHER_VERSION_INPUT" in
            head*) environments='[{"version":"17","environment":"head"}]' ;;
            v2.16-head*) environments='[{"version":"16","environment":"head"}]' ;;
            v2.16*-rc*) environments='[{"version":"16","environment":"head"}]' ;;
            v2.16.*) environments='[{"version":"16","environment":"latest"}]' ;;
            v2.15.*) environments='[{"version":"15","environment":"latest"}]' ;;
          esac
          echo "matrix={\"include\":$environments}" >> "$GITHUB_OUTPUT"

  prime:
    needs: [prepare-matrix-prime]
    if: ${{ needs.prepare-matrix-prime.outputs.matrix != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix-prime.outputs.matrix) }}
    name: ${{ format('Rancher Prime Setup v2.{0}', matrix.version) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          submodules: recursive

      - name: Checkout tfp-automation repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          repository: rancher/tfp-automation
          path: tfp-automation

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa #v3
        with:
          secret-ids: |
            AWS_ACCESS_KEY, ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_KEY, ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME, HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME
            HB_SSH_PRIVATE_KEY, HB_SSH_PRIVATE_KEY
            HB_SSH_PRIVATE_KEY_NAME, HB_SSH_PRIVATE_KEY_NAME
            HB_WINDOWS_SSH_PRIVATE_KEY, HB_WINDOWS_SSH_PRIVATE_KEY
            HB_WINDOWS_SSH_PRIVATE_KEY_NAME, HB_WINDOWS_SSH_PRIVATE_KEY_NAME
            HB_PRIVATE_FULL_CHAIN, HB_PRIVATE_FULL_CHAIN
            HB_PRIVATE_FULL_CHAIN_NAME, HB_PRIVATE_FULL_CHAIN_NAME
            HB_PRIVATE_CERT_KEY, HB_PRIVATE_CERT_KEY
            HB_PRIVATE_CERT_KEY_NAME, HB_PRIVATE_CERT_KEY_NAME
            HB_AWS_REGION, HB_AWS_REGION
            HB_AWS_ROUTE_53_ZONE, HB_AWS_ROUTE_53_ZONE
            HB_TERRAFORM_VERSION, HB_TERRAFORM_VERSION
            HB_RANCHER_ADMIN_PASSWORD, HB_RANCHER_ADMIN_PASSWORD
            HB_RANCHER_VERSION_2_17_HEAD, HB_RANCHER_VERSION_2_17_HEAD
            HB_RANCHER_VERSION_2_16_HEAD, HB_RANCHER_VERSION_2_16_HEAD
            HB_RANCHER_VERSION_2_15_HEAD, HB_RANCHER_VERSION_2_15_HEAD
            HB_RANCHER_VERSION_2_14_HEAD, HB_RANCHER_VERSION_2_14_HEAD
            HB_RELEASED_RANCHER_VERSION_2_17, HB_RELEASED_RANCHER_VERSION_2_17
            HB_RELEASED_RANCHER_VERSION_2_16, HB_RELEASED_RANCHER_VERSION_2_16
            HB_RELEASED_RANCHER_VERSION_2_15, HB_RELEASED_RANCHER_VERSION_2_15
            HB_RELEASED_RANCHER_VERSION_2_14, HB_RELEASED_RANCHER_VERSION_2_14
            HB_RELEASED_RANCHER_CHART_VERSION_2_17, HB_RELEASED_RANCHER_CHART_VERSION_2_17
            HB_RELEASED_RANCHER_CHART_VERSION_2_16, HB_RELEASED_RANCHER_CHART_VERSION_2_16
            HB_RELEASED_RANCHER_CHART_VERSION_2_15, HB_RELEASED_RANCHER_CHART_VERSION_2_15
            HB_RELEASED_RANCHER_CHART_VERSION_2_14, HB_RELEASED_RANCHER_CHART_VERSION_2_14
            HB_RKE2_VERSION_2_17, HB_RKE2_VERSION_2_17
            HB_K3S_VERSION_2_17, HB_K3S_VERSION_2_17
            HB_RKE2_VERSION_2_16, HB_RKE2_VERSION_2_16
            HB_K3S_VERSION_2_16, HB_K3S_VERSION_2_16
            HB_RKE2_VERSION_2_15, HB_RKE2_VERSION_2_15
            HB_K3S_VERSION_2_15, HB_K3S_VERSION_2_15
            HB_RKE2_VERSION_2_14, HB_RKE2_VERSION_2_14
            HB_K3S_VERSION_2_14, HB_K3S_VERSION_2_14
            HB_K3S_VERSION_SUFFIX, HB_K3S_VERSION_SUFFIX
            HB_RANCHER_HELM_CHART_URL, HB_RANCHER_HELM_CHART_URL
            HB_STAGING_RANCHER_HELM_CHART_URL, HB_STAGING_RANCHER_HELM_CHART_URL
            HB_COMMUNITY_HELM_CHART_URL, HB_COMMUNITY_HELM_CHART_URL
            HB_PATH_TO_TFP_REPO, HB_PATH_TO_TFP_REPO

      - name: Fetch and Set DockerHub Credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 #v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials username | DOCKERHUB_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials password | DOCKERHUB_PASSWORD

      - name: Masking Secrets
        uses: ./.github/actions/mask-secrets
        with:
          secret-env-vars: |
            DOCKERHUB_USERNAME
            DOCKERHUB_PASSWORD
            HB_SSH_PRIVATE_KEY
            HB_SSH_PRIVATE_KEY_NAME
            HB_WINDOWS_SSH_PRIVATE_KEY
            HB_WINDOWS_SSH_PRIVATE_KEY_NAME
            HB_PRIVATE_FULL_CHAIN
            HB_PRIVATE_FULL_CHAIN_NAME
            HB_PRIVATE_CERT_KEY
            HB_PRIVATE_CERT_KEY_NAME
      
      - name: Mask password
        run: |
          echo "::add-mask::$RANCHER_PASSWORD"

      - name: Whitelist Runner IP
        id: whitelist-runner-ip
        uses: ./.github/actions/whitelist-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME).value }}
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"

      - name: Set up SSH Keys
        id: setup-ssh-keys
        uses: ./.github/actions/setup-ssh-keys
        with:
          ssh-private-key: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY).value }}
          ssh-private-key-name: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY_NAME).value }}
          windows-ssh-private-key: ${{ fromJSON(env.HB_WINDOWS_SSH_PRIVATE_KEY).value }}
          windows-ssh-private-key-name: ${{ fromJSON(env.HB_WINDOWS_SSH_PRIVATE_KEY_NAME).value }}

      - name: Set up certificates
        id: setup-certs
        uses: ./.github/actions/setup-certs
        with:
          private-full-chain: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN).value }}
          private-full-chain-name: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN_NAME).value }}
          private-cert-key: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY).value }}
          private-cert-key-name: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY_NAME).value }}

      - name: Uniquify hostname prefix
        uses: ./.github/actions/uniquify-hostname

      - name: Set Rancher version
        uses: ./.github/actions/set-env-var
        with:
          key: RANCHER_VERSION
          value: |
            ${{ 
              github.event.inputs.rancher_version || 
              (github.event_name == 'workflow_dispatch' && github.event.inputs.rancher_version)
            }}

      - name: Set Rancher chart version
        uses: ./.github/actions/set-env-var
        with:
          key: RANCHER_CHART_VERSION
          value: |
            ${{ 
              github.event.inputs.rancher_chart_version || 
              (github.event_name == 'workflow_dispatch' && github.event.inputs.rancher_chart_version)
            }}

      - name: Set Rancher repo
        if: matrix.environment == 'staging-latest'
        uses: ./.github/actions/set-rancher-repo
        with:
          rancher-version: ${{ env.RANCHER_VERSION }}
          fallback-repo: ${{ secrets.RANCHER_REPO }}
          is-prime: true
          release-prime-version: ${{ format('2.{0}', matrix.version) }}
      
      - name: Set Rancher chart url
        if: matrix.environment == 'staging-latest'
        uses: ./.github/actions/set-rancher-chart-url
        with:
          rancher-repo: ${{ env.RANCHER_REPO }}
          is-prime: true
          community-chart-url: "${{ fromJSON(env.HB_COMMUNITY_HELM_CHART_URL).value }}"
          staging-chart-url: "${{ fromJSON(env.HB_STAGING_RANCHER_HELM_CHART_URL).value }}"
          fallback-chart-url: ${{ secrets.RANCHER_HELM_CHART_URL }}

      - name: Create config.yaml
        run: |
          cat > config.yaml <<EOF
          rancher:
            host: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
            adminPassword: "$RANCHER_PASSWORD"

          awsCredentials:
            accessKey: "$AWS_ACCESS_KEY"
            secretKey: "$AWS_SECRET_KEY"
            defaultRegion: "${{ fromJSON(env.HB_AWS_REGION).value }}"

          terraform:
            localCluster: "${{ env.LOCAL_CLUSTER_TYPE }}"
            privateKeyPath: "${{ steps.setup-ssh-keys.outputs.ssh-private-key-path }}"
            windowsPrivateKeyPath: "${{ steps.setup-ssh-keys.outputs.windows-ssh-private-key-path }}"
            privateFullChainPath: "${{ steps.setup-certs.outputs.private-full-chain-tfp-path }}"
            privateCertKeyPath: "${{ steps.setup-certs.outputs.private-cert-key-tfp-path }}"
            resourcePrefix: "${{ env.HOSTNAME_PREFIX }}"
            standalone:
              bootstrapPassword: "$RANCHER_PASSWORD"
              chartVersion: "${{ env.RANCHER_CHART_VERSION }}"
              k3sVersion: "${{ env.LOCAL_CLUSTER_K8S_VERSION }}${{ vars.K3S_VERSION_SUFFIX }}"
              rancherAgentImage: "${{ secrets.RANCHER_AGENT_IMAGE }}"
              rancherChartRepository: "${{ matrix.channel == 'prime-head' && '<HB_PRIME_HEAD_HELM_CHART_URL>' || matrix.channel == 'staging-latest' && env.RANCHER_HELM_CHART_URL || secrets.RANCHER_HELM_CHART_URL }}"
              rancherHostname: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
              rancherImage: "${{ matrix.version >= '16' && matrix.channel == 'prime-head' && '<HB_PRIME_HEAD_RANCHER_SERVER_IMAGE>' || secrets.RANCHER_IMAGE }}"
              rancherTagVersion: "${{ env.RANCHER_VERSION }}"
              registryPassword: "${{ env.DOCKERHUB_PASSWORD }}"
              registryUsername: "${{ env.DOCKERHUB_USERNAME }}"
              repo: "${{ matrix.channel == 'staging-latest' && env.RANCHER_REPO || secrets.RANCHER_REPO }}"
              rke2Version: "${{ env.LOCAL_CLUSTER_K8S_VERSION }}"
          EOF

      - name: Export CATTLE_TEST_CONFIG
        run: echo "CATTLE_TEST_CONFIG=${{ github.workspace }}/config.yaml" >> $GITHUB_ENV
        shell: bash

      - name: Set up Go environment
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6
        with:
          go-version-file: "./go.mod"

      - name: Build Packages
        run: ./.github/scripts/go-build.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 #v4
        with:
          terraform_version: "${{ fromJSON(env.HB_TERRAFORM_VERSION).value }}"
          terraform_wrapper: false

      - name: Creating Rancher server
        run: go run /home/runner/work/tests/tests/validation/recurring/infrastructure/setuprancher/standard/main.go

      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Revoke Runner IP
        if: always()
        uses: ./.github/actions/revoke-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME).value }}
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"
  
  community:
    needs: [prepare-matrix-community]
    if: ${{ needs.prepare-matrix-community.outputs.matrix != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare-matrix-community.outputs.matrix) }}
    name: ${{ format('Rancher Community Setup v2.{0}', matrix.version) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          submodules: recursive

      - name: Checkout tfp-automation repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          repository: rancher/tfp-automation
          path: tfp-automation

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa #v3
        with:
          secret-ids: |
            AWS_ACCESS_KEY, ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_KEY, ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            HB_AWS_MANAGED_PREFIX_LIST_ID, HB_AWS_MANAGED_PREFIX_LIST_ID
            HB_SSH_PRIVATE_KEY, HB_SSH_PRIVATE_KEY
            HB_SSH_PRIVATE_KEY_NAME, HB_SSH_PRIVATE_KEY_NAME
            HB_WINDOWS_SSH_PRIVATE_KEY, HB_WINDOWS_SSH_PRIVATE_KEY
            HB_WINDOWS_SSH_PRIVATE_KEY_NAME, HB_WINDOWS_SSH_PRIVATE_KEY_NAME
            HB_PRIVATE_FULL_CHAIN, HB_PRIVATE_FULL_CHAIN
            HB_PRIVATE_FULL_CHAIN_NAME, HB_PRIVATE_FULL_CHAIN_NAME
            HB_PRIVATE_CERT_KEY, HB_PRIVATE_CERT_KEY
            HB_PRIVATE_CERT_KEY_NAME, HB_PRIVATE_CERT_KEY_NAME
            HB_AWS_REGION, HB_AWS_REGION
            HB_AWS_ROUTE_53_ZONE, HB_AWS_ROUTE_53_ZONE
            HB_TERRAFORM_VERSION, HB_TERRAFORM_VERSION
            HB_RANCHER_ADMIN_PASSWORD, HB_RANCHER_ADMIN_PASSWORD
            HB_RANCHER_VERSION_2_17_HEAD, HB_RANCHER_VERSION_2_17_HEAD
            HB_RANCHER_VERSION_2_16_HEAD, HB_RANCHER_VERSION_2_16_HEAD
            HB_RELEASED_RANCHER_VERSION_2_17, HB_RELEASED_RANCHER_VERSION_2_17
            HB_RELEASED_RANCHER_VERSION_2_16, HB_RELEASED_RANCHER_VERSION_2_16
            HB_RELEASED_RANCHER_CHART_VERSION_2_17, HB_RELEASED_RANCHER_CHART_VERSION_2_17
            HB_RELEASED_RANCHER_CHART_VERSION_2_16, HB_RELEASED_RANCHER_CHART_VERSION_2_16
            HB_RKE2_VERSION_2_17, HB_RKE2_VERSION_2_17
            HB_K3S_VERSION_2_17, HB_K3S_VERSION_2_17
            HB_RKE2_VERSION_2_16, HB_RKE2_VERSION_2_16
            HB_K3S_VERSION_2_16, HB_K3S_VERSION_2_16
            HB_K3S_VERSION_SUFFIX, HB_K3S_VERSION_SUFFIX
            HB_RANCHER_HELM_CHART_URL, HB_RANCHER_HELM_CHART_URL
            HB_STAGING_RANCHER_HELM_CHART_URL, HB_STAGING_RANCHER_HELM_CHART_URL
            HB_COMMUNITY_HELM_CHART_URL, HB_COMMUNITY_HELM_CHART_URL
            HB_PATH_TO_TFP_REPO, HB_PATH_TO_TFP_REPO

      - name: Fetch and Set DockerHub Credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 #v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials username | DOCKERHUB_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials password | DOCKERHUB_PASSWORD

      - name: Masking Secrets
        uses: ./.github/actions/mask-secrets
        with:
          secret-env-vars: |
            DOCKERHUB_USERNAME
            DOCKERHUB_PASSWORD
            HB_SSH_PRIVATE_KEY
            HB_SSH_PRIVATE_KEY_NAME
            HB_WINDOWS_SSH_PRIVATE_KEY
            HB_WINDOWS_SSH_PRIVATE_KEY_NAME
            HB_PRIVATE_FULL_CHAIN
            HB_PRIVATE_FULL_CHAIN_NAME
            HB_PRIVATE_CERT_KEY
            HB_PRIVATE_CERT_KEY_NAME
      
      - name: Mask password
        run: |
          echo "::add-mask::$RANCHER_PASSWORD"

      - name: Whitelist Runner IP
        id: whitelist-runner-ip
        uses: ./.github/actions/whitelist-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_AWS_MANAGED_PREFIX_LIST_ID).value }}
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"

      - name: Set up SSH Keys
        id: setup-ssh-keys
        uses: ./.github/actions/setup-ssh-keys
        with:
          ssh-private-key: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY).value }}
          ssh-private-key-name: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY_NAME).value }}
          windows-ssh-private-key: ${{ fromJSON(env.HB_WINDOWS_SSH_PRIVATE_KEY).value }}
          windows-ssh-private-key-name: ${{ fromJSON(env.HB_WINDOWS_SSH_PRIVATE_KEY_NAME).value }}

      - name: Set up certificates
        id: setup-certs
        uses: ./.github/actions/setup-certs
        with:
          private-full-chain: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN).value }}
          private-full-chain-name: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN_NAME).value }}
          private-cert-key: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY).value }}
          private-cert-key-name: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY_NAME).value }}

      - name: Uniquify hostname prefix
        uses: ./.github/actions/uniquify-hostname

      - name: Set Rancher version
        uses: ./.github/actions/set-env-var
        with:
          key: RANCHER_VERSION
          value: |
            ${{ 
              github.event.inputs.rancher_version || 
              (github.event_name == 'workflow_dispatch' && github.event.inputs.rancher_version)
            }}

      - name: Set Rancher chart version
        uses: ./.github/actions/set-env-var
        with:
          key: RANCHER_CHART_VERSION
          value: |
            ${{ 
              github.event.inputs.rancher_chart_version || 
              (github.event_name == 'workflow_dispatch' && github.event.inputs.rancher_chart_version)
            }}

      - name: Set Rancher repo
        if: matrix.environment == 'head'
        uses: ./.github/actions/set-rancher-repo
        with:
          rancher-version: ${{ env.RANCHER_VERSION }}
          fallback-repo: ${{ secrets.RANCHER_REPO }}
          is-prime: false
          release-community-version: ${{ format('2.{0}', matrix.version) }}

      - name: Set Rancher chart url
        if: matrix.environment == 'head'
        uses: ./.github/actions/set-rancher-chart-url
        with:
          rancher-repo: ${{ env.RANCHER_REPO }}
          is-prime: false
          community-chart-url: "${{ fromJSON(env.HB_COMMUNITY_HELM_CHART_URL).value }}"
          staging-chart-url: "${{ fromJSON(env.HB_STAGING_RANCHER_HELM_CHART_URL).value }}"
          fallback-chart-url: ${{ secrets.RANCHER_HELM_CHART_URL }}

      - name: Create config.yaml
        run: |
          cat > config.yaml <<EOF
          rancher:
            host: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
            adminPassword: "$RANCHER_PASSWORD"

          awsCredentials:
            accessKey: "$AWS_ACCESS_KEY"
            secretKey: "$AWS_SECRET_KEY"
            defaultRegion: "${{ fromJSON(env.HB_AWS_REGION).value }}"

          terraform:
            localCluster: "${{ env.LOCAL_CLUSTER_TYPE }}"
            privateKeyPath: "${{ steps.setup-ssh-keys.outputs.ssh-private-key-path }}"
            windowsPrivateKeyPath: "${{ steps.setup-ssh-keys.outputs.windows-ssh-private-key-path }}"
            privateFullChainPath: "${{ steps.setup-certs.outputs.private-full-chain-tfp-path }}"
            privateCertKeyPath: "${{ steps.setup-certs.outputs.private-cert-key-tfp-path }}"
            resourcePrefix: "${{ env.HOSTNAME_PREFIX }}"
            awsConfig:
              awsSecurityGroups: ["<HB_AWS_SECURITY_GROUPS_COMMUNITY>"]
              awsSecurityGroupNames: ["<HB_AWS_SECURITY_GROUP_NAMES_COMMUNITY>"]
            rancherConfig:
              awsConfig:
                awsSecurityGroups: ["<HB_AWS_SECURITY_GROUPS_COMMUNITY>"]
                awsSecurityGroupNames: ["<HB_AWS_SECURITY_GROUP_NAMES_COMMUNITY>"]
            standalone:
              bootstrapPassword: "$RANCHER_PASSWORD"
              chartVersion: "${{ env.RANCHER_CHART_VERSION }}"
              k3sVersion: "${{ env.LOCAL_CLUSTER_K8S_VERSION }}${{ vars.K3S_VERSION_SUFFIX }}"
              rancherChartRepository: "${{ matrix.environment == 'head' && env.RANCHER_HELM_CHART_URL || secrets.RANCHER_HELM_CHART_URL }}"
              rancherHostname: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
              rancherImage: "${{ matrix.version >= '16' && '<HB_RANCHER_SERVER_IMAGE>' || secrets.RANCHER_IMAGE }}"
              rancherTagVersion: "${{ env.RANCHER_VERSION }}"
              registryPassword: "${{ env.DOCKERHUB_PASSWORD }}"
              registryUsername: "${{ env.DOCKERHUB_USERNAME }}"
              repo: "${{ matrix.environment == 'head' && env.RANCHER_REPO || secrets.RANCHER_REPO }}"
              rke2Version: "${{ env.LOCAL_CLUSTER_K8S_VERSION }}"
          EOF

      - name: Export CATTLE_TEST_CONFIG
        run: echo "CATTLE_TEST_CONFIG=${{ github.workspace }}/config.yaml" >> $GITHUB_ENV
        shell: bash

      - name: Set up Go environment
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6
        with:
          go-version-file: "./go.mod"

      - name: Build Packages
        run: ./.github/scripts/go-build.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 #v4
        with:
          terraform_version: "${{ fromJSON(env.HB_TERRAFORM_VERSION).value }}"
          terraform_wrapper: false

      - name: Creating Rancher server
        run: go run /home/runner/work/tests/tests/validation/recurring/infrastructure/setuprancher/standard/main.go

      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Revoke Runner IP
        if: always()
        uses: ./.github/actions/revoke-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_AWS_MANAGED_PREFIX_LIST_ID).value }}
          region: "${{ fromJSON(env.HB_AWS_REGION).value }}"
---
name: EKS Provisioning

on:
  workflow_dispatch:
    inputs:
      rancher_version:
        description: "Rancher tag version"
        required: false
      rancher_chart_version:
        description: "Rancher chart version"
        required: false
      run_all_versions:
        description: "Run all supported versions if manually triggered"
        required: false
        default: false
        type: boolean
      reporting:
        description: "Enable reporting to Qase and Slack"
        required: false
        default: false
        type: boolean
      qase_test_run_id:
        description: "Optional Qase test run ID override"
        required: false
        type: string
      environment_cleanup:
        description: "Enable environment cleanup after test run"
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  CLOUD_PROVIDER: "eks"
  CLOUD_PROVIDER_VERSION: "6.50.0"
  REPORTING_ENABLED: >-
        ${{
          github.event_name == 'schedule' ||
          github.actor == 'github-actions[bot]' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.reporting == 'true' )
        }}
  CLEANUP_ENABLED: >-
    ${{
      github.event_name == 'schedule' ||
      github.actor == 'github-actions[bot]' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment_cleanup == 'true' )
    }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    env:
      RUN_ALL_VERSIONS: ${{ github.event.inputs.run_all_versions || 'false' }}
      RANCHER_VERSION_INPUT: ${{ github.event.inputs.rancher_version }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [[ "$RUN_ALL_VERSIONS" == "true" || "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            versions='["16", "15", "14"]'
          else
            case "$RANCHER_VERSION_INPUT" in
              head) versions='["16"]' ;;
              v2.15-head) versions='["15"]' ;;
              v2.14-head) versions='["14"]' ;;
              *) versions='[]' ;;
            esac
          fi
          echo "matrix={\"version\":$versions}" >> "$GITHUB_OUTPUT"

  eks-provisioning:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    name: v2-${{ matrix.version }}
    runs-on: ubuntu-latest
    environment: hosted
    env:
      HOSTNAME_PREFIX: "eks-${{ matrix.version }}"
      OLD_HOSTNAME_PREFIX: "eks-${{ matrix.version }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          submodules: recursive

      - name: Checkout tfp-automation repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          repository: rancher/tfp-automation
          path: tfp-automation

      - name: Install eksctl
        run: |
          ARCH=amd64
          PLATFORM=$(uname -s)_$ARCH

          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$PLATFORM.tar.gz"
          tar -xzf eksctl_$PLATFORM.tar.gz -C /tmp && rm eksctl_$PLATFORM.tar.gz
          sudo install -m 0755 /tmp/eksctl /usr/local/bin && rm /tmp/eksctl

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get AWS credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa #v3
        with:
          secret-ids: |
            AWS_ACCESS_KEY, ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_KEY, ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME, HB_AWS_MANAGED_PREFIX_LIST_ID_PRIME
            HB_SSH_PRIVATE_KEY, HB_SSH_PRIVATE_KEY
            HB_SSH_PRIVATE_KEY_NAME, HB_SSH_PRIVATE_KEY_NAME
            HB_WINDOWS_SSH_PRIVATE_KEY, HB_WINDOWS_SSH_PRIVATE_KEY
            HB_WINDOWS_SSH_PRIVATE_KEY_NAME, HB_WINDOWS_SSH_PRIVATE_KEY_NAME
            HB_PRIVATE_FULL_CHAIN, HB_PRIVATE_FULL_CHAIN
            HB_PRIVATE_FULL_CHAIN_NAME, HB_PRIVATE_FULL_CHAIN_NAME
            HB_PRIVATE_CERT_KEY, HB_PRIVATE_CERT_KEY
            HB_PRIVATE_CERT_KEY_NAME, HB_PRIVATE_CERT_KEY_NAME
            HB_CLOUD_SSH_KEY, HB_CLOUD_SSH_KEY
            HB_CLOUD_SSH_KEY_NAME, HB_CLOUD_SSH_KEY_NAME
            HB_AWS_REGION, HB_AWS_REGION
            HB_TERRAFORM_VERSION, HB_TERRAFORM_VERSION
            HB_RANCHER_ADMIN_PASSWORD, HB_RANCHER_ADMIN_PASSWORD
            HB_RANCHER_VERSION_2_16_HEAD, HB_RANCHER_VERSION_2_16_HEAD
            HB_RANCHER_VERSION_2_15_HEAD, HB_RANCHER_VERSION_2_15_HEAD
            HB_RANCHER_VERSION_2_14_HEAD, HB_RANCHER_VERSION_2_14_HEAD
            HB_RELEASED_RANCHER_CHART_VERSION_2_16, HB_RELEASED_RANCHER_CHART_VERSION_2_16
            HB_RELEASED_RANCHER_CHART_VERSION_2_15, HB_RELEASED_RANCHER_CHART_VERSION_2_15
            HB_RELEASED_RANCHER_CHART_VERSION_2_14, HB_RELEASED_RANCHER_CHART_VERSION_2_14
            HB_QASE_RECURRING_TEST_RUN_ID_2_16, HB_QASE_RECURRING_TEST_RUN_ID_2_16
            HB_QASE_RECURRING_TEST_RUN_ID_2_15, HB_QASE_RECURRING_TEST_RUN_ID_2_15
            HB_QASE_RECURRING_TEST_RUN_ID_2_14, HB_QASE_RECURRING_TEST_RUN_ID_2_14
            HB_QA_PRIVATE_REGISTRY_NAME, HB_QA_PRIVATE_REGISTRY_NAME
            HB_QASE_AUTOMATION_TOKEN, HB_QASE_AUTOMATION_TOKEN
            HB_QASE_PROJECT_ID, HB_QASE_PROJECT_ID
            HB_RANCHER_HELM_CHART_URL, HB_RANCHER_HELM_CHART_URL
            HB_STAGING_RANCHER_HELM_CHART_URL, HB_STAGING_RANCHER_HELM_CHART_URL
            HB_SLACK_WEBHOOK_URL, HB_SLACK_WEBHOOK_URL
            HB_EKS_MANAGED_PREFIX_LIST_ID, HB_EKS_MANAGED_PREFIX_LIST_ID
            HB_EKS_REGION, HB_EKS_REGION
            HB_GCP_PROJECT_ID, HB_GCP_PROJECT_ID
            HB_GCP_ZONE, HB_GCP_ZONE

      - name: Fetch and Set DockerHub Credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 #v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials username | DOCKERHUB_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/org-token/credentials password | DOCKERHUB_PASSWORD

      - name: Masking Secrets
        uses: ./.github/actions/mask-secrets
        with:
          secret-env-vars: |
            DOCKERHUB_USERNAME
            DOCKERHUB_PASSWORD
            HB_QASE_AUTOMATION_TOKEN
            HB_SSH_PRIVATE_KEY
            HB_SSH_PRIVATE_KEY_NAME
            HB_WINDOWS_SSH_PRIVATE_KEY
            HB_WINDOWS_SSH_PRIVATE_KEY_NAME
            HB_PRIVATE_FULL_CHAIN
            HB_PRIVATE_FULL_CHAIN_NAME
            HB_PRIVATE_CERT_KEY
            HB_PRIVATE_CERT_KEY_NAME
            HB_CLOUD_SSH_KEY
            HB_CLOUD_SSH_KEY_NAME

      - name: Whitelist Runner IP
        uses: ./.github/actions/whitelist-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_EKS_MANAGED_PREFIX_LIST_ID).value }}
          region: "${{ fromJSON(env.HB_EKS_REGION).value }}"

      - name: Set up SSH Keys
        id: setup-ssh-keys
        uses: ./.github/actions/setup-ssh-keys
        with:
          ssh-private-key: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY).value }}
          ssh-private-key-name: ${{ fromJSON(env.HB_SSH_PRIVATE_KEY_NAME).value }}
          windows-ssh-private-key: ${{ fromJSON(env.HB_WINDOWS_SSH_PRIVATE_KEY).value }}
          windows-ssh-private-key-name: ${{ fromJSON(env.HB_WINDOWS_SSH_PRIVATE_KEY_NAME).value }}

      - name: Set up certificates
        id: setup-certs
        uses: ./.github/actions/setup-certs
        with:
          private-full-chain: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN).value }}
          private-full-chain-name: ${{ fromJSON(env.HB_PRIVATE_FULL_CHAIN_NAME).value }}
          private-cert-key: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY).value }}
          private-cert-key-name: ${{ fromJSON(env.HB_PRIVATE_CERT_KEY_NAME).value }}

      - name: Uniquify hostname prefix
        uses: ./.github/actions/uniquify-hostname

      - name: Set Rancher version
        uses: ./.github/actions/set-env-var
        with:
          key: RANCHER_VERSION
          value: |
            ${{ 
              github.event.inputs.rancher_version || 
              (github.event_name == 'workflow_dispatch' && github.event.inputs.rancher_version) || 
              (github.event_name == 'schedule' && fromJSON(env[format('HB_RANCHER_VERSION_2_{0}_HEAD', matrix.version)]).value) ||
              (github.event.inputs.run_all_versions == 'true' && fromJSON(env[format('HB_RANCHER_VERSION_2_{0}_HEAD', matrix.version)]).value)
            }}

      - name: Set Rancher chart version
        uses: ./.github/actions/set-env-var
        with:
          key: RANCHER_CHART_VERSION
          value: |
            ${{ 
              github.event.inputs.rancher_chart_version || 
              (github.event_name == 'workflow_dispatch' && github.event.inputs.rancher_chart_version) || 
              (github.event_name == 'schedule' && fromJSON(env[format('HB_RELEASED_RANCHER_CHART_VERSION_2_{0}', matrix.version)]).value) ||
              (github.event.inputs.run_all_versions == 'true' && fromJSON(env[format('HB_RELEASED_RANCHER_CHART_VERSION_2_{0}', matrix.version)]).value)
            }}

      - name: Get Qase ID
        id: get-qase-id
        uses: ./.github/actions/get-qase-id
        with:
          qase_recurring_id: ${{ fromJSON(env[format('HB_QASE_RECURRING_TEST_RUN_ID_2_{0}', matrix.version)]).value }}

      - name: Create config.yaml
        run: |
          cat > config.yaml <<EOF
          rancher:
            host: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
            adminPassword: "<HB_RANCHER_ADMIN_PASSWORD>"
            insecure: true
            cleanup: ${{ env.CLEANUP_ENABLED }}
          terraform:
            cni: "<HB_CNI>"
            defaultClusterRoleForProjectMembers: "true"
            enableNetworkPolicy: false
            generateV3Token: ${{ matrix.version == '14' }}
            localHostedCluster: true
            provider: "eks"
            privateKeyPath: "<HB_TFP_SSH_PRIVATE_KEY_PATH>"
            privateFullChainPath: "${{ steps.setup-certs.outputs.private-full-chain-tfp-path }}"
            privateCertKeyPath: "${{ steps.setup-certs.outputs.private-cert-key-tfp-path }}"
            resourcePrefix: "${{ env.HOSTNAME_PREFIX }}"
            awsCredentials:
              awsAccessKey: "$AWS_ACCESS_KEY"
              awsSecretKey: "$AWS_SECRET_KEY"
            awsConfig:
              ami: "<HB_EKS_AMI>"
              awsKeyName: "<HB_SSH_PRIVATE_KEY_NAME>"
              awsInstanceType: "<HB_AWS_INSTANCE_TYPE>"
              awsVolumeType: "<HB_AWS_VOLUME_TYPE>"
              eksRegion: "<HB_EKS_REGION>"
              region: "<HB_EKS_REGION>"
              awsSecurityGroups: ["<HB_EKS_SECURITY_GROUPS>"]
              awsSecurityGroupNames: ["<HB_AWS_SECURITY_GROUP_NAMES_PRIME>"]
              awsSubnetID: "<HB_EKS_SUBNET_ID>"
              rancherSubnetID: "<HB_EKS_SUBNET_ID>"
              awsVpcID: "<HB_EKS_VPC_ID>"
              awsZoneLetter: "<HB_AWS_ZONE_LETTER>"
              awsRootSize: "<HB_AWS_ROOT_SIZE>"
              awsRoute53Zone: "<HB_AWS_ROUTE_53_ZONE>"
              awsUser: "<HB_AWS_OS_USER>"
              sshConnectionType: "<HB_SSH_CONNECTION_TYPE>"
              timeout: "<HB_SSH_TIMEOUT>"
              ipAddressType: "<HB_IP_ADDRESS_TYPE>"
              loadBalancerType: "<HB_LOAD_BALANCER_TYPE>"
              targetType: "<HB_TARGET_TYPE>"
              publicAccess: true
              privateAccess: true
            standalone:
              bootstrapPassword: "<HB_RANCHER_ADMIN_PASSWORD>"
              certManagerVersion: "<HB_CERT_MANAGER_VERSION>"
              chartVersion: "${{ env.RANCHER_CHART_VERSION }}"
              osUser: "<HB_AWS_OS_USER>"
              osGroup: "<HB_AWS_OS_GROUP>"
              rancherChartRepository: "<HB_PRIME_HEAD_HELM_CHART_URL>"
              rancherHostname: "${{ env.HOSTNAME_PREFIX }}.<HB_AWS_ROUTE_53_ZONE>"
              rancherImage: "<HB_PRIME_HEAD_RANCHER_IMAGE>"
              rancherTagVersion: "${{ env.RANCHER_VERSION }}"
              registryUsername: "${{ env.DOCKERHUB_USERNAME }}"
              registryPassword: "${{ env.DOCKERHUB_PASSWORD }}"
              repo: "<HB_PRIME_HEAD_REPO>"
          terratest:
            pathToRepo: "<HB_PATH_TO_TFP_REPO>"
            standaloneLogging: false

          logging:
            level: "<HB_LOGGING_LEVEL>"

          awsCredentials:
            accessKey: "$AWS_ACCESS_KEY"
            defaultRegion: "${{ fromJSON(env.HB_AWS_REGION).value }}"
            secretKey: "$AWS_SECRET_KEY"

          eksClusterConfig:
            imported: false
            kmsKey: ""
            loggingTypes: []
            nodeGroups:
            - desiredSize: 3
              diskSize: 50
              ec2SshKey: "<HB_SSH_PRIVATE_KEY_NAME>"
              gpu: false
              imageId: ""
              instanceType: t3.medium
              labels: {}
              maxSize: 5
              minSize: 3
              nodeRole: ""
              nodegroupName: "${{ env.HOSTNAME_PREFIX }}"
              requestSpotInstances: false
              resourceTags: {}
              spotInstanceTypes: []
              subnets: []
              tags: {}
              userData: ""
            privateAccess: false
            publicAccess: true
            publicAccessSources: []
            region: "<HB_EKS_REGION>"
            secretsEncryption: false
            securityGroups: ["<HB_EKS_SECURITY_GROUPS>"]
            serviceRole: ""
            subnets: ["<HB_EKS_SUBNETS>"]
            tags: {}
          EOF

      - name: Export CATTLE_TEST_CONFIG
        run: echo "CATTLE_TEST_CONFIG=${{ github.workspace }}/config.yaml" >> $GITHUB_ENV
        shell: bash

      - name: Set up Go environment
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6
        with:
          go-version-file: "./go.mod"

      - name: Build Packages
        run: ./.github/scripts/go-build.sh

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@c4a0df2e75a225d979a444342dd3db752b53619f

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 #v4
        with:
          terraform_version: "${{ fromJSON(env.HB_TERRAFORM_VERSION).value }}"
          terraform_wrapper: false

      - name: Creating Rancher server
        run: go run /home/runner/work/tests/tests/validation/recurring/infrastructure/setuprancher/hosted/main.go

      - name: Run Provisioning tests
        env:
          QASE_TEST_RUN_ID: ${{ inputs.qase_test_run_id || steps.get-qase-id.outputs.id }}
          QASE_AUTOMATION_TOKEN: ${{ fromJSON(env.HB_QASE_AUTOMATION_TOKEN).value }}
          QASE_CUSTOM_FIELD_FILTER: Hostbusters
          QASE_SCHEMA_PREFIX: hostbusters
          QASE_PROJECT_ID: ${{ fromJSON(env.HB_QASE_PROJECT_ID).value }}
        uses: ./.github/actions/run-hostbusters-provisioning
        with:
          reporting: ${{ env.REPORTING_ENABLED }}
          tags: eks

      - name: Refresh AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 #v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Cloud Provider Infrastructure Cleanup
        if: always() && env.CLEANUP_ENABLED == 'true'
        uses: ./.github/actions/cloud-provider-cleanup
        with:
          cloud-provider: ${{ env.CLOUD_PROVIDER }}
          google-project-id: "${{ fromJSON(env.HB_GCP_PROJECT_ID).value }}"
          google-zone: "${{ fromJSON(env.HB_GCP_ZONE).value }}"
          prefix: "${{ env.OLD_HOSTNAME_PREFIX }}"
          region: "${{ fromJSON(env.HB_EKS_REGION).value }}"
          iam-role: ${{ secrets.IAM_ROLE }}

      - name: Revoke Runner IP
        if: always()
        uses: ./.github/actions/revoke-runner-ip
        with:
          prefix-list-id: ${{ fromJSON(env.HB_EKS_MANAGED_PREFIX_LIST_ID).value }}
          region: "${{ fromJSON(env.HB_EKS_REGION).value }}"

      - name: Set job status output
        if: always()
        run: echo "job_status=${{ job.status }}" >> $GITHUB_OUTPUT
        id: set-job-status

      - name: Reporting Results to Slack
        if: always() && env.REPORTING_ENABLED == 'true'
        uses: ./.github/actions/report-to-slack
        with:
          rancher-version: ${{ env.RANCHER_VERSION }}
          job-status: ${{ steps.set-job-status.outputs.job_status }}
          slack-webhook-url: ${{ fromJSON(env.HB_SLACK_WEBHOOK_URL).value }}

      - name: Save test result weekly summary
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/save-weekly-summary-result
        with:
          rancher_version: ${{ env.RANCHER_VERSION }}
          workflow: eks-provisioning
          job: v2-${{ matrix.version }}
              certManagerVersion: "${{ vars.CERT_MANAGER_VERSION }}"
              chartVersion: "${{ env.RANCHER_CHART_VERSION }}"
              osUser: "${{ vars.OS_USER }}"
              osGroup: "${{ vars.OS_GROUP }}"
              rancherAgentImage: "${{ secrets.RANCHER_AGENT_IMAGE }}"

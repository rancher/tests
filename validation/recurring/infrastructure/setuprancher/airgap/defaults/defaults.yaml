rancher:
  host: "<required>.<HB_AWS_ROUTE_53_ZONE>"
  adminPassword: "<HB_RANCHER_ADMIN_PASSWORD>"
  insecure: true
  cleanup: true

awsCredentials:
  accessKey: "<required>"
  secretKey: "<required>"
  defaultRegion: "<required>"

terraform:
  provider: "<HB_PROVIDER>"
  downstreamClusterProvider: "<HB_PROVIDER>"
  resourcePrefix: "<HB_HOSTNAME_PREFIX>"
  localCluster: "rke2"
  cni: "<HB_CNI>"
  defaultClusterRoleForProjectMembers: "<HB_CLUSTER_ROLE_FOR_PROJECT_MEMBERS>"
  privateKeyPath: "<HB_TFP_SSH_PRIVATE_KEY_PATH>"
  awsCredentials:
    awsAccessKey: "<AWS_ACCESS_KEY_ID>"
    awsSecretKey: "<AWS_SECRET_ACCESS_KEY>"
  privateRegistries:
    url: "<HB_PRIVATE_REGISTRY_URL>"
  awsConfig:
    ami: "<HB_AIRGAP_AWS_AMI>"
    awsKeyName: "<HB_SSH_PRIVATE_KEY_NAME>"
    awsInstanceType: "<HB_AWS_INSTANCE_TYPE>"
    awsVolumeType: "<HB_AWS_VOLUME_TYPE>"
    region: "<HB_AWS_REGION>"
    awsSecurityGroups: ["<HB_AIRGAP_AWS_SECURITY_GROUPS>"]
    awsSecurityGroupNames: ["<HB_AIRGAP_AWS_SECURITY_GROUP_NAMES>"]
    awsSubnetID: "<HB_AIRGAP_AWS_SUBNET_ID>"
    awsVpcID: "<HB_AIRGAP_AWS_VPC_ID>"
    awsVpcIP: "<HB_AIRGAP_AWS_VPC_IP>"
    awsZoneLetter: "<HB_AWS_ZONE_LETTER>"
    awsRootSize: "<HB_AWS_ROOT_SIZE>"
    registryRootSize: "<HB_AWS_ROOT_SIZE_REGISTRY>"
    awsRoute53Zone: "<HB_AWS_ROUTE_53_ZONE>"
    ipAddressType: "<HB_IP_ADDRESS_TYPE>"
    loadBalancerType: "<HB_LOAD_BALANCER_TYPE>"
    targetType: "<HB_TARGET_TYPE>"
    awsUser: "<HB_AWS_OS_USER>"
    sshConnectionType: "<HB_SSH_CONNECTION_TYPE>"
    timeout: "<HB_SSH_TIMEOUT>"
  standalone:
    chartVersion: "<required>"
    rancherTagVersion: "<required>"
    rancherChartRepository: "<required>"
    repo: "<required>"
    rancherImage: "<HB_RANCHER_IMAGE>"
    rancherHostname: "<required>"
    bootstrapPassword: "<HB_RANCHER_ADMIN_PASSWORD>"
    certManagerVersion: "<HB_CERT_MANAGER_VERSION>"
    certType: "<HB_CERT_TYPE>"
    osUser: "<HB_AWS_OS_USER>"
    osGroup: "<HB_AWS_OS_GROUP>"
    registryPassword: "<HB_PRIVATE_REGISTRY_PASSWORD>"
    registryUsername: "<HB_PRIVATE_REGISTRY_USERNAME>"
    rke2Version: "<HB_RKE2_VERSION>"
  standaloneRegistry:
    assetsPath: "<HB_ASSETS_PATH>"
    registryName: "<HB_HOSTNAME_PREFIX>"
terratest:
  pathToRepo: "<HB_PATH_TO_TFP_REPO>"
  standaloneLogging: false
  tfLogging: false
logging:
  level: "<HB_LOGGING_LEVEL>"

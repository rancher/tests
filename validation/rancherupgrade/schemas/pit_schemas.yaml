- projects: [RANCHERINT]
  suite: Rancher Upgrade/Longhorn
  cases:
  - title: "Longhorn pre-upgrade setup"
    description: "Install Longhorn and seed a checksum workload on a Longhorn volume before the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Create a project on the Rancher local cluster"
      data: ""
      expectedresult: "The project is created successfully"
      position: 1
    - action: "Install the Longhorn chart at the latest version offered by the pre-upgrade Rancher"
      data: "Chart: longhorn from the rancher-charts repo"
      expectedresult: "Longhorn installs and its deployments and daemonsets become Ready"
      position: 2
    - action: "Create the checksum workload on a Longhorn-backed PVC"
      data: "1GiB PVC and nginx deployment named rancher-upgrade-longhorn with data file /auto-mnt/checksum-data"
      expectedresult: "PVC is Bound, deployment rolls out, and the checksum data is written to the Longhorn volume"
      position: 3
    custom_field:
      "15": "TestLonghornPreUpgrade"
  - title: "Longhorn post-upgrade validation"
    description: "Verify Longhorn and its volume data survive the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Check the Longhorn chart installation state"
      data: "Chart: longhorn in longhorn-system"
      expectedresult: "The chart is still installed"
      position: 2
    - action: "Verify the checksum workload on the Longhorn volume"
      data: "PVC rancher-upgrade-longhorn and data file /auto-mnt/checksum-data"
      expectedresult: "PVC is Bound and the sha256 of the data file matches the pre-upgrade content"
      position: 3
    custom_field:
      "15": "TestLonghornPostUpgrade"
  - title: "Longhorn chart upgrade after Rancher upgrade"
    description: "Upgrade Longhorn to the version offered by the upgraded Rancher catalog and verify workload data"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Resolve the latest Longhorn chart version from the cluster-scoped catalog"
      data: "Chart: longhorn from the rancher-charts repo"
      expectedresult: "The latest cluster-scoped chart version is resolved and differs from the installed pre-upgrade version"
      position: 2
    - action: "Upgrade the Longhorn chart with retry"
      data: "longhorn and longhorn-crd to the latest version"
      expectedresult: "The longhorn chart reaches Deployed state and workloads become Ready"
      position: 3
    - action: "Verify the chart version and the checksum workload"
      data: "Chart version equals latest; PVC rancher-upgrade-longhorn and data file /auto-mnt/checksum-data"
      expectedresult: "Installed chart version matches latest and the sha256 of the data file still matches the pre-upgrade content"
      position: 4
    custom_field:
      "15": "TestLonghornChartUpgrade"
  - title: "NeuVector pre-upgrade setup"
    description: "Install NeuVector and prove admission control enforcement before the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Resolve the System project on the Rancher local cluster"
      data: "Project: System"
      expectedresult: "The System project is resolved for the chart install"
      position: 1
    - action: "Install the NeuVector chart at the latest version offered by the pre-upgrade Rancher"
      data: "Chart: neuvector and neuvector-crd from the rancher-charts repo in cattle-neuvector-system"
      expectedresult: "NeuVector installs and its deployments and daemonsets become Ready"
      position: 2
    - action: "Enable the NeuVector admission control deny rule"
      data: "NvAdmissionControlSecurityRule named local in protect mode denying workload creates in namespace rancher-upgrade-neuvector-deny"
      expectedresult: "The custom resource is applied and the neuvector-validating-admission-webhook ValidatingWebhookConfiguration exists"
      position: 3
    - action: "Prove the admission webhook denies a known-bad create"
      data: "Pod create in namespace rancher-upgrade-neuvector-deny"
      expectedresult: "The create is rejected with an admission webhook denial"
      position: 4
    custom_field:
      "15": "TestNeuVectorPreUpgrade"
  - title: "NeuVector post-upgrade validation"
    description: "Verify NeuVector services, manager UI and admission enforcement survive the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Check the NeuVector chart installation state"
      data: "Chart: neuvector in cattle-neuvector-system"
      expectedresult: "The chart is still installed"
      position: 2
    - action: "Verify the NeuVector services are active"
      data: "neuvector-service-webui, neuvector-svc-controller, neuvector-svc-admission-webhook"
      expectedresult: "All expected NeuVector services exist and are active"
      position: 3
    - action: "Verify the NeuVector manager web UI is reachable"
      data: "Rancher service proxy path for neuvector-service-webui port 8443"
      expectedresult: "The manager web UI responds through the Rancher service proxy"
      position: 4
    - action: "Verify the admission webhook still denies the known-bad create"
      data: "Pod create in namespace rancher-upgrade-neuvector-deny"
      expectedresult: "The create is rejected with an admission webhook denial"
      position: 5
    custom_field:
      "15": "TestNeuVectorPostUpgrade"
  - title: "NeuVector chart upgrade after Rancher upgrade"
    description: "Upgrade NeuVector to the version offered by the upgraded Rancher catalog and re-verify health and enforcement"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Resolve the latest NeuVector chart version from the cluster-scoped catalog"
      data: "Chart: neuvector from the rancher-charts repo"
      expectedresult: "The latest cluster-scoped chart version is resolved and differs from the installed pre-upgrade version"
      position: 2
    - action: "Upgrade the NeuVector chart with retry, preserving the installed release values"
      data: "neuvector and neuvector-crd to the latest version, reusing the installed App values"
      expectedresult: "The neuvector chart reaches Deployed state and workloads become Ready"
      position: 3
    - action: "Verify the chart version, service health and admission enforcement"
      data: "Chart version equals latest; NeuVector services active; pod create in namespace rancher-upgrade-neuvector-deny denied"
      expectedresult: "Installed chart version matches latest, all expected services are active and the admission webhook still denies the create"
      position: 4
    custom_field:
      "15": "TestNeuVectorChartUpgrade"

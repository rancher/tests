# Required for all dualstack/ipv6 tests.
clusterConfig:
  networking:
    clusterCIDR: "<HB_DUALSTACK_CLUSTER_CIDR>"
    serviceCIDR: "<HB_DUALSTACK_SERVICE_CIDR>"
    stackPreference: "<HB_STACK_PREFERENCE_DUAL>"
  advanced:
    machineGlobalConfig:
      flannel-ipv6-masq: true

awsMachineConfigs:
  region: "<HB_AWS_REGION>"
  awsMachineConfig:
  - roles: ["etcd", "controlplane", "worker"]
    ami: "<HB_AWS_DUALSTACK_AMI>"
    instanceType: "<HB_AWS_INSTANCE_TYPE>"
    volumeType: "<HB_AWS_VOLUME_TYPE>"
    rootSize: "<HB_AWS_ROOT_SIZE>"
    sshUser: "<HB_DUAL_STACK_AWS_USER>"
    vpcId: "<HB_AWS_VPC_ID>"
    zone: "<HB_AWS_ZONE_LETTER>"
    subnetId: "<HB_AWS_SUBNET_ID>"
    securityGroup: ["<HB_AWS_SECURITY_GROUP_NAMES_COMMUNITY>"]
    retries: "5"
    enablePrimaryIPv6: true
    httpProtocolIpv6: "enabled"
    ipv6AddressCount: "1"

awsEC2Configs:
  region: "<HB_AWS_REGION>"
  awsSecretAccessKey: "<AWS_SECRET_ACCESS_KEY>"
  awsAccessKeyID: "<AWS_ACCESS_KEY_ID>"
  awsEC2Config:
    - instanceType: "<HB_AWS_INSTANCE_TYPE>"
      awsAMI: "<HB_AWS_DUALSTACK_AMI>"
      awsSecurityGroups: ["<HB_AWS_SECURITY_GROUPS_COMMUNITY>"]
      awsSecurityGroupNames: ["<HB_AWS_SECURITY_GROUP_NAMES_COMMUNITY>"]
      awsSSHKeyName: "<HB_SSH_PRIVATE_KEY_NAME>.pem"
      awsCICDInstanceTag: "<HB_AWS_CICD_INSTANCE_TAG>"
      awsIAMProfile: "<HB_AWS_IAM_PROFILE>"
      awsUser: "<HB_DUAL_STACK_AWS_USER>"
      volumeSize: "<HB_AWS_ROOT_SIZE>"
      roles: ["etcd", "controlplane", "worker"]

sshPath:
  sshPath: "<HB_TESTS_SSH_DIR_PATH>"

terraform:
  awsConfig:
    ami: "<HB_AWS_DUALSTACK_AMI>"
    awsUser: "<HB_DUAL_STACK_AWS_USER>"
    clusterCIDR: "<HB_DUALSTACK_CLUSTER_CIDR>"
    serviceCIDR: "<HB_DUALSTACK_SERVICE_CIDR>"
    enablePrimaryIPv6: true
    httpProtocolIpv6: "enabled"
    ipAddressType: "ipv4"
    loadBalancerType: "dualstack"
    targetType: "instance"
    ipv6AddressCount: "1"
    awsSecurityGroups: ["<HB_AWS_SECURITY_GROUPS_COMMUNITY>"]
    awsSecurityGroupNames: ["<HB_AWS_SECURITY_GROUP_NAMES_COMMUNITY>"]
    networking:
      stackPreference: "dual"
  standalone:
    osUser: "<HB_DUAL_STACK_AWS_USER>"
    osGroup: "<HB_DUAL_STACK_OS_GROUP>"
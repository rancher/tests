azureCredentials:
  clientId: "<HB_AZURE_CLIENT_ID>"
  clientSecret: "<HB_AZURE_CLIENT_SECRET>"
  subscriptionId: "<HB_AZURE_SUBSCRIPTION_ID>"
  environment: "AzurePublicCloud"

aksClusterConfig:
  dnsPrefix: "<required>"
  linuxAdminUsername: "<HB_AZURE_SSH_USER>"
  loadBalancerSku: "Standard"
  networkPlugin: "kubenet"
  nodePools:
  - availabilityZones:
    - "1"
    - "2"
    - "3"
    enableAutoScaling: true
    maxPods: 110
    maxCount: 10
    minCount: 3
    mode: "System"
    name: "agentpool"
    nodeCount: 3
    osDiskSizeGB: 128
    osDiskType: "Managed"
    osType: "Linux"
    vmSize: "Standard_DS2_v2"
  resourceGroup: "<required>"
  resourceLocation: "<HB_AZURE_LOCATION>"
  tags: {}


googleCredentials:
  authEncodedJson: |-
    {
      "type": "service_account",
      "project_id": "<required>",
      "private_key_id": "<required>",
      "private_key": "<required>",
      "client_email": "<required>",
      "client_id": "<required>",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "<required>"
    }

gkeClusterConfig:
  autopilotConfig:
    enabled: false
  clusterAddons:
    horizontalPodAutoscaling: true
    httpLoadBalancing: true
    networkPolicyConfig: false
  clusterIpv4Cidr: ""
  enableKubernetesAlpha: false
  horizontalPodAutoscaling: true
  httpLoadBalancing: true
  ipAllocationPolicy:
    clusterIpv4Cidr: ""
    clusterIpv4CidrBlock: null
    clusterSecondaryRangeName: null
    createSubnetwork: false
    nodeIpv4CidrBlock: null
    servicesIpv4CidrBlock: null
    servicesSecondaryRangeName: null
    subnetworkName: null
    useIpAliases: true
  labels: {}
  locations: []
  loggingService: logging.googleapis.com/kubernetes
  maintenanceWindow: ""
  masterAuthorizedNetworks:
    enabled: false
  monitoringService: monitoring.googleapis.com/kubernetes
  network: default
  networkPolicyConfig: false
  networkPolicyEnabled: false
  nodePools:
  - autoscaling:
      enabled: false
      maxNodeCount: null
      minNodeCount: null
    config:
      diskSizeGb: 100
      diskType: pd-standard
      imageType: COS_CONTAINERD
      labels: {}
      localSsdCount: 0
      machineType: n1-standard-2
      oauthScopes:
      - https://www.googleapis.com/auth/devstorage.read_only
      - https://www.googleapis.com/auth/logging.write
      - https://www.googleapis.com/auth/monitoring
      - https://www.googleapis.com/auth/servicecontrol
      - https://www.googleapis.com/auth/service.management.readonly
      - https://www.googleapis.com/auth/trace.append
      preemptible: false
      tags: null
      taints: null
    initialNodeCount: 3
    isNew: true
    management:
      autoRepair: true
      autoUpgrade: true
    maxPodsConstraint: 110
    name: "<required>"
  privateClusterConfig:
    enablePrivateEndpoint: false
    enablePrivateNodes: false
    masterIpv4CidrBlock: null
  projectID: "<required>"
  subnetwork: "<required>"
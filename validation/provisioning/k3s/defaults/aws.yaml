# Required for the template test
templateChart:
  repo:
    metadata:
      name: "test"
    spec:
      gitRepo: "https://github.com/rancher/cluster-template-examples"
      gitBranch: "main"
      insecureSkipTLSVerify: true
  templateProvider: "aws"
  templateName: "cluster-template"

  templateValues:
    cloudprovider: "amazonec2"
    cloudCredentialSecretName: "amazonec2"

    nodepools:
      "0":
        etcd: true
        controlplane: false
        worker: false
        quantity: 3
        createSecurityGroup: true
        ami: "<HB_DEFAULT_AMI>"
        instanceType: "<HB_AWS_INSTANCE_TYPE>"
        region: "<HB_AWS_REGION>"
        subnetId: "<HB_AWS_SUBNET_ID>"
        vpcId: "<HB_AWS_VPC_ID>"
        zone: "<HB_AWS_ZONE>"
        rootSize: "<HB_AWS_ROOT_SIZE>"
        volumeType: "<HB_AWS_VOLUME_TYPE>"

      "1":
        etcd: false
        controlplane: true
        worker: false
        quantity: 2
        createSecurityGroup: true
        ami: "<HB_DEFAULT_AMI>"
        instanceType: "<HB_AWS_INSTANCE_TYPE>"
        region: "<HB_AWS_REGION>"
        subnetId: "<HB_AWS_SUBNET_ID>"
        vpcId: "<HB_AWS_VPC_ID>"
        rootSize: "<HB_AWS_ROOT_SIZE>"
        volumeType: "<HB_AWS_VOLUME_TYPE>"

      "2":
        etcd: false
        controlplane: false
        worker: true
        quantity: 3
        createSecurityGroup: true
        ami: "<HB_DEFAULT_AMI>"
        instanceType: "<HB_AWS_INSTANCE_TYPE>"
        region: "<HB_AWS_REGION>"
        subnetId: "<HB_AWS_SUBNET_ID>"
        vpcId: "<HB_AWS_VPC_ID>"
        rootSize: "<HB_AWS_ROOT_SIZE>"
        volumeType: "<HB_AWS_VOLUME_TYPE>"

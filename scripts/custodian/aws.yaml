  filters:
    - type: value
      key: DBClusterIdentifier
      op: regex
      value:  "^.*(USERKEYS).*$"
    - DeletionProtection: false
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_unknown_user': absent
    - "tag:ec2_known_user": absent
    - "tag:DeletesOnFriday": absent
    - not:
      - type: value
        key: DBClusterIdentifier
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_known_user

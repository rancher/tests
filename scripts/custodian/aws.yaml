      tag: ec2_known_user
      op: delete
      hours: 36

- name: rds-delete-marked
  resource: aws.rds
  filters:
    - DBClusterIdentifier: absent
    - DeletionProtection: false
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - or:
      - type: marked-for-op
        tag: ec2_unknown_user
        op: delete
      - type: marked-for-op
        tag: ec2_known_user
        op: delete
  actions:
    - type: delete
      skip-snapshot: true

- name: rds-cluster-mark-unknown-for-deletion

# key-pairs
- name: mark-unknown-unused-keypairs-for-deletion
  resource: aws.key-pair
  description: |
    Mark unknown user key-pairs for deletion in 12 hours
  filters:
    # only show unused keys. note that aws won't let you delete used keys.
    - unused
    # instance name not in accepted user keys
    - type: value
      key: KeyName
      op: regex
      #doesNOTcontain
      value:  "^((?!USERKEYS).)*$"
    # instance is not doNotDelete
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_known_user': absent
    - "tag:DeletesOnFriday": absent
    - "tag:ec2_unknown_user": absent
    - not: 
      - type: value
        key: KeyName
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
    - not: 
      - type: value
        key: KeyName
        op: regex
        value:  "^.*-validation.*$"
  actions:
    - type: mark-for-op
      tag: ec2_unknown_user
      op: delete
      hours: 12

- name: mark-known-unused-keypairs-for-deletion
  resource: aws.key-pair
  description: |
    Mark known user key-pairs for deletion in 36 hours
  filters:
    - unused
    - type: value
      key: KeyName
      op: regex
      value:  "^.*USERKEYS.*$"
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_unknown_user': absent
    - "tag:DeletesOnFriday": absent
    - "tag:ec2_known_user": absent
    - not: 
      - type: value
        key: KeyName
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
    - not: 
      - type: value
        key: KeyName
        op: regex
        value:  "^.*-validation.*$"
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: delete
      hours: 36

- name: ec2-delete-keypairs
  resource: aws.key-pair
  description: |
    Delete any marked keypairs which have been 
    marked for deletion for more than 1 day.
  filters:
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - unused
    - or:
      - type: marked-for-op
        tag: ec2_unknown_user
        op: delete
      - type: marked-for-op
        tag: ec2_known_user
        op: delete
  actions:
    - type: delete

# Elastic IPs
- name: schedule-release-elasticip
  resource: network-addr
  filters:
    - 'tag:DoNotDelete': absent
    - 'tag:doNotDelete': absent
    - 'tag:ec2_known_user': absent
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: release
      # extending by 1 day to avoid deleting before associated resources are cleaned up
      days: 3

- name: release-expired-elasticip
  resource: network-addr
  description: |
    Delete any marked elasticips which have been 
    marked for deletion for more than 1 day.
  filters:
      - 'tag:doNotDelete': absent
      - 'tag:DoNotDelete': absent
      - type: marked-for-op
        tag: ec2_known_user
        op: release
  actions:
    - type: release

# Target Groups
- name: schedule-delete-targetgroup
  resource: app-elb-target-group
  filters:
    - 'tag:DoNotDelete': absent
    - 'tag:doNotDelete': absent
    - 'tag:ec2_known_user': absent
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: delete
      # extending by 1 day to avoid deleting before associated resources are cleaned up
      days: 3
- name: ec2-filter-targetgroup
  resource: app-elb-target-group
  description: |
    Delete any marked targetGroups which have been 
    marked for deletion for more than 1 day.
  filters:
      - type: marked-for-op
        tag: ec2_known_user
        op: delete
  actions:
    - type: invoke-lambda
      function: check-targetgroup-in-use
      batch_size: 50
      timeout: 75
- name: ec2-delete-targetgroup-from-lambda
  resource: app-elb-target-group
  description: |
    Delete target groups that have been confirmed unused
    by the Lambda checker.
  filters:
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - type: marked-for-op
      tag: ec2_known_user
      op: delete
    - type: value
      key: "length(Tags[?Key=='delete-safe'])"
      value: 1
      op: eq
  actions:
    - type: delete

# Security Groups
- name: schedule-delete-securitygroup
  resource: security-group
  description: |
    Mark unused, non-default security groups for deletion.
  filters:
    - 'tag:DoNotDelete': absent
    - 'tag:doNotDelete': absent
    - 'tag:ec2_known_user': absent
    - type: unused
    - type: value
      key: GroupName
      op: ne
      value: default
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: delete
      days: 3

- name: ec2-delete-securitygroup
  resource: security-group
  description: |
    Delete unused, non-default security groups that were previously
    marked for deletion.
  filters:
    - 'tag:DoNotDelete': absent
    - 'tag:doNotDelete': absent
    - type: unused
    - type: value
      key: GroupName
      op: ne
      value: default
    - type: marked-for-op
      tag: ec2_known_user
      op: delete
  actions:
    - delete

- name: rds-mark-unknown-for-deletion
  resource: aws.rds
  filters:
    - type: value
      key: DBInstanceIdentifier
      op: regex
      value:  "^((?!USERKEYS).)*$"
    - DBClusterIdentifier: absent
    - DeletionProtection: false
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_known_user': absent
    - "tag:ec2_unknown_user": absent
    - "tag:DeletesOnFriday": absent
    - not:
      - type: value
        key: DBInstanceIdentifier
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_unknown_user
      op: delete
      hours: 12

- name: rds-mark-known-for-deletion
  resource: aws.rds
  filters:
    - type: value
      key: DBInstanceIdentifier
      op: regex
      value:  "^.*(USERKEYS).*$"
    - DBClusterIdentifier: absent
    - DeletionProtection: false
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_unknown_user': absent
    - "tag:ec2_known_user": absent
    - "tag:DeletesOnFriday": absent
    - not:
      - type: value
        key: DBInstanceIdentifier
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"

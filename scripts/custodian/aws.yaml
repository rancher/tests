- name: rds-cluster-delete-marked
  resource: aws.rds-cluster
  filters:
    - DeletionProtection: false
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - or:
      - type: marked-for-op
        tag: ec2_unknown_user
        op: delete
      - type: marked-for-op
        tag: ec2_known_user
        op: delete
  actions:
    - type: delete
      skip-snapshot: true
      delete-instances: true

- name: natgateway-mark-idle-for-deletion
  resource: aws.nat-gateway
  filters:
    - State: available
    - type: value
      key: CreateTime
      value_type: age
      op: gt
      value: 7
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_known_user': absent
    - not:
      - type: value
        key: tag:Name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
    - type: metrics
      name: BytesOutToDestination
      statistics: Sum
      days: 7
      value: 0
      op: eq
      missing-value: 0
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: delete
      hours: 36

- name: natgateway-unmark-if-active
  resource: aws.nat-gateway
  filters:
    - State: available
    - "tag:ec2_known_user": not-null
    - type: metrics
      name: BytesOutToDestination
      statistics: Sum
      days: 1
      value: 0
      op: gt
      missing-value: 0
  actions:
    - type: remove-tag
      tags: ['ec2_known_user']

- name: natgateway-delete-idle
  resource: aws.nat-gateway
  filters:
    - State: available
    - type: value
      key: CreateTime
      value_type: age
      op: gt
      value: 7
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - type: marked-for-op
      tag: ec2_known_user
      op: delete
    - type: metrics
      name: BytesOutToDestination
      statistics: Sum
      days: 7
      value: 0
      op: eq
      missing-value: 0
  actions:
    - type: delete

- name: ebs-mark-unattached-for-deletion
  resource: aws.ebs
  filters:
    - State: available
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_known_user': absent
    - not:
      - type: value
        key: tag:Name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: delete
      hours: 36

- name: ebs-unmark-if-attached
  resource: aws.ebs
  filters:
    - State: in-use
    - "tag:ec2_known_user": not-null
  actions:
    - type: remove-tag
      tags: ['ec2_known_user']

- name: ebs-delete-unattached
  resource: aws.ebs
  filters:
    - State: available
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - type: marked-for-op
      tag: ec2_known_user
      op: delete
  actions:
    - type: delete

- name: ebs-mark-old-snapshots-for-deletion
  resource: aws.ebs-snapshot
  filters:
    - type: age
      days: 14
      op: ge
    - type: skip-ami-snapshots
      value: true
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_known_user': absent
    - 'tag:aws:dlm:lifecycle-policy-id': absent
    - not:
      - type: value
        key: Description
        op: regex
        value:  "^.*(DONOTDELETEKEYS|AWS Backup).*$"
    - not:
      - type: value
        key: tag:Name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: delete
      hours: 72

- name: ebs-delete-old-snapshots
  resource: aws.ebs-snapshot
  filters:
    - type: age
      days: 14
      op: ge
    - type: skip-ami-snapshots
      value: true
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:aws:dlm:lifecycle-policy-id': absent
    - not:
      - type: value
        key: Description
        op: regex
        value:  "^.*(DONOTDELETEKEYS|AWS Backup).*$"
    - not:
      - type: value
        key: tag:Name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
    - type: marked-for-op
      tag: ec2_known_user
      op: delete
  actions:
    - type: delete

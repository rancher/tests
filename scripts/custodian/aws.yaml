policies:

# Instances
- name: mark-unknown-instances-for-deletion
  resource: aws.ec2
  description: |
    Mark unknown user instances for deletion in 12 hours
  filters:
    - type: value
      key: State.Name
      op: not-in
      value: [shutting-down, terminated]
    # instance name not in accepted user keys
    - type: value
      key: tag:Name
      op: regex
      #doesNOTcontain
      value:  "^((?!USERKEYS).)*$"
    # instance is not doNotDelete
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_known_user': absent
    - "tag:DeletesOnFriday": absent
    - "tag:ec2_unknown_user": absent
    - not: 
      - type: value
        key: tag:Name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_unknown_user
      op: terminate
      hours: 12

- name: mark-known-instances-for-deletion
  resource: aws.ec2
  description: |
    Mark known user instances for deletion in 36 hours
  filters:
    - type: value
      key: State.Name
      op: not-in
      value: [shutting-down, terminated]
    - type: value
      key: tag:Name
      op: regex
      value:  "^.*(USERKEYS).*$"
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_unknown_user': absent
    - "tag:DeletesOnFriday": absent
    - "tag:ec2_known_user": absent
    - not: 
      - type: value
        key: tag:Name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: terminate
      hours: 36

- name: ec2-unmark-if-friday-tagged
  resource: aws.ec2
  description: |
    Remove the deletion tag from any resource group which now contain resources
    so it doesn't get deleted by the following policy
  filters:
    - or:
      - "tag:ec2_unknown_user": not-null
      - "tag:ec2_known_user": not-null
    - "tag:DeletesOnFriday": present
  actions:
    - type: remove-tag
      tags: ['ec2_unknown_user', 'ec2_known_user']


- name: ec2-terminate-instances
  resource: aws.ec2
  description: |
    Delete any marked instances which have been 
    marked for deletion for more than 1 day.
    Skips instances with termination or stop protection enabled.
  filters:
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - or:
      - type: marked-for-op
        tag: ec2_unknown_user
        op: terminate
      - type: marked-for-op
        tag: ec2_known_user
        op: terminate
    - not:
      - type: termination-protected
    - not:
      - type: stop-protected
  actions:
    - type: terminate


# EKS Policies Disclaimer
# Note: cannot manage EKS nodegroups at this time, but the
# above ec2 policies should take care of any nodes

# There is a resource for eks-nodegroup in cloud custodian, 
# however there is no support for time delay nor tagging.

# EKS
- name: eks-mark-unknown-instances-for-deletion
  resource: aws.eks
  description: |
    Mark unknown user instances for deletion in 12 hours
  filters:
    - type: value
      key: name
      op: regex
      #doesNOTcontain
      value:  "^((?!USERKEYS).)*$"
    # instance is not doNotDelete
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_known_user': absent
    - "tag:ec2_unknown_user": absent
    - "tag:DeletesOnFriday": absent
    - not: 
      - type: value
        key: name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_unknown_user
      op: delete
      hours: 12

- name: eks-mark-known-instances-for-deletion
  resource: aws.eks
  description: |
    Mark known user instances for deletion in 36 hours
  filters:
    - type: value
      key: name
      op: regex
      value:  "^.*(USERKEYS).*$"
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - 'tag:ec2_unknown_user': absent
    - "tag:ec2_known_user": absent
    - "tag:DeletesOnFriday": absent
    - not: 
      - type: value
        key: name
        op: regex
        value:  "^.*(DONOTDELETEKEYS).*$"
  actions:
    - type: mark-for-op
      tag: ec2_known_user
      op: delete
      hours: 36

- name: eks-unmark-if-friday-tagged
  resource: aws.eks
  description: |
    Remove the deletion tag from any resource group which now contain resources
    so it doesn't get deleted by the following policy
  filters:
    - or:
      - "tag:ec2_unknown_user": not-null
      - "tag:ec2_known_user": not-null
    - "tag:DeletesOnFriday": present
  actions:
    - type: remove-tag
      tags: ['ec2_unknown_user', 'ec2_known_user']

- name: eks-terminate-instances
  resource: aws.eks
  description: |
    Delete any marked instances which have been 
    marked for deletion for more than 1 day.
    Skips clusters with deletion protection enabled.
  filters:
    - 'tag:doNotDelete': absent
    - 'tag:DoNotDelete': absent
    - type: value
      key: deletionProtection
      value: true
      op: ne
    - or:
      - type: marked-for-op
        tag: ec2_unknown_user
        op: delete
      - type: marked-for-op
        tag: ec2_known_user
        op: delete
  actions:
    - type: delete

